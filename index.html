<style>
:root{
  /* True near-black base for real contrast — cards clearly lift off it with
     visible depth instead of sitting in a murky mid-tone band. Accent is a
     vivid saturated coral (a lit stamp-ink red, not a desaturated brick),
     used for every primary action and active state. Gold is reserved
     purely for money figures, and is now a genuinely warm metallic gold
     rather than a muted brass. */
  --bg:#0a0c10; --bg-alt:#050608;
  --card:#15181f; --card-hi:#1c2029;
  --card-rgb: 21,24,31;
  --line:#262b35; --line-hi:#343b48;
  --ink:#f3f2ef; --ink-dim:#a9afbb; --ink-faint:#6b7280;
  --gold:#e0ad4f; --gold-dim:#9c7a35; --gold-bg:#2a2112;
  --seal:#ff6b4a; --seal-dim:#d4553a; --seal-bg:#2e1912;
  --seal-rgb: 255,107,74;
  --green:#4fd199; --green-bg:#122921;
  --rust:#ff6b4a; --rust-bg:#2e1912;
  --blue:#6ea8e8; --blue-bg:#151f2e;
  --radius:12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,.35);
  --shadow-glow: 0 0 0 1px rgba(var(--seal-rgb),.15), 0 4px 20px rgba(var(--seal-rgb),.12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    /* Crisp warm-white paper, not clinical blue-white and not muddy ivory. */
    --bg:#f3f1ec; --bg-alt:#ffffff;
    --card:#ffffff; --card-hi:#faf8f4;
    --card-rgb: 255,255,255;
    --line:#e5e1d8; --line-hi:#d3cdbf;
    --ink:#1a1814; --ink-dim:#5c5648; --ink-faint:#8c8575;
    --gold:#b8862a; --gold-dim:#e0ad4f; --gold-bg:#fbf0db;
    --seal:#e0492b; --seal-dim:#ff6b4a; --seal-bg:#fce7e1;
    --seal-rgb: 224,73,43;
    --green:#1f9a6b; --green-bg:#e2f5ec;
    --rust:#e0492b; --rust-bg:#fce7e1;
    --blue:#3372c4; --blue-bg:#e6eefb;
    --shadow-sm: 0 1px 2px rgba(20,15,5,.06);
    --shadow-md: 0 4px 16px rgba(20,15,5,.08);
    --shadow-glow: 0 0 0 1px rgba(var(--seal-rgb),.12), 0 4px 20px rgba(var(--seal-rgb),.1);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c10; --bg-alt:#050608; --card:#15181f; --card-hi:#1c2029; --line:#262b35; --line-hi:#343b48;
  --ink:#f3f2ef; --ink-dim:#a9afbb; --ink-faint:#6b7280;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  height:100%; -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
.tabular{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
button{ font-family:inherit; }
input, select{ font-family:inherit; }

/* ---------- shell ---------- */
#app{ display:flex; min-height:100%; }
.rail{
  width:220px; flex-shrink:0; background:var(--bg-alt); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 12px;
  position:sticky; top:0; height:100vh; height:100dvh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 10px 22px; }
.brand .mark{ width:26px; height:26px; border-radius:6px; background:linear-gradient(135deg,var(--seal),var(--seal-dim)); flex-shrink:0; }
.brand .name{ font-size:15px; font-weight:600; letter-spacing:.2px; }
.brand .sub{ font-size:11px; color:var(--ink-faint); }
nav.navlist{ display:flex; flex-direction:column; gap:2px; }
nav.navlist button{
  display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
  color:var(--ink-dim); padding:10px 11px; border-radius:9px; cursor:pointer; font-size:13.5px;
  transition:all .13s ease; font-weight:500;
}
nav.navlist button svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
nav.navlist button:hover{ background:var(--card); color:var(--ink); }
nav.navlist button.active{ background:var(--card-hi); color:var(--ink); box-shadow:inset 3px 0 0 var(--seal); font-weight:650; }
.rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }
.rail-foot button{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px; padding:9px; border-radius:9px; cursor:pointer; transition:all .13s ease; }
.rail-foot button:hover{ color:var(--ink); border-color:var(--line-hi); background:var(--card); }

main{ flex:1; min-width:0; padding:26px 30px 90px; max-width:900px; }
.page-title{ font-size:20px; font-weight:600; margin:0 0 4px; }
.page-sub{ font-size:13px; color:var(--ink-faint); margin:0 0 22px; }

/* bottom tab bar (mobile) */
.tabbar{ display:none; }

@media (max-width: 760px){
  .rail{ display:none; }
  #app{ flex-direction:column; }
  main{ padding:16px 14px 90px; max-width:100%; }
  .tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg-alt); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    justify-content:space-around;
  }
  .tabbar button{ background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px 6px;cursor:pointer; }
  .tabbar button svg{ width:19px;height:19px; }
  .tabbar button.active{ color:var(--seal); }
}

/* ---------- primitives ---------- */

    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});

  if('serviceWorker' in navigator){

      .then(reg => { window._swRegistration = reg; })
      .catch(()=>{ /* older browsers / unsupported — app still works */ });

/* ---------- DB LAYER (IndexedDB) ---------- */
const DB_NAME = 'ipo_ledger_db';
const DB_VERSION = 1;
const STORES = ['banks','applicants','ipos','applications','transfers','sales','meta'];
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('banks')) d.createObjectStore('banks',{keyPath:'id'});
      if(!d.objectStoreNames.contains('applicants')) d.createObjectStore('applicants',{keyPath:'id'});
      if(!d.objectStoreNames.contains('ipos')) d.createObjectStore('ipos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('applications')) d.createObjectStore('applications',{keyPath:'id'});
      if(!d.objectStoreNames.contains('transfers')) d.createObjectStore('transfers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = (e)=>{ resolve(e.target.result); };
    req.onerror = (e)=>{ reject(e); };
  });
}

function txStore(name, mode='readonly'){
  const tx = db.transaction(name, mode);
  return tx.objectStore(name);
}
function idbAll(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store).getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = reject;
  });
}
const SYNCABLE_STORES = new Set(['banks','applicants','ipos','applications','transfers','sales']);
function idbPut(store, obj){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').put(obj);
    req.onsuccess = ()=>{
      resolve(obj);
      if(SYNCABLE_STORES.has(store)) cloudPut(store, obj); // fire-and-forget; local write already succeeded
    };
    req.onerror = reject;
  });
}
function idbDelete(store, id){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').delete(id);
    req.onsuccess = ()=>{
      resolve();
      if(SYNCABLE_STORES.has(store)) cloudDelete(store, id);
    };
    req.onerror = reject;
  });
}
function idbClear(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').clear();
    req.onsuccess = ()=>resolve();
    req.onerror = reject;
  });
}

function fmtMoney(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  const s = n.toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-':'')+'₹'+s;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// allotmentDateTentative / listingDateTentative: published-but-not-final
// dates the live feed may supply ahead of the company's confirmed
// allotmentDate/listingDate. Shown with a "(tentative)" label and never
// used for status badges or notifications — only a confirmed date drives
// those, so an early or revised tentative date can't misfire a "check
// allotment today" alert.

// Pull every number out of a price band string like "₹123–₹130" or "Rs. 32 - 34"
// (handles –, —, - as separators and stray commas) and returns the highest one.
function parseMaxPriceFromBand(band){
  if(!band) return 0;
  const nums = String(band).replace(/,/g,'').match(/\d+(\.\d+)?/g);
  if(!nums || nums.length===0) return 0;
  return Math.max(...nums.map(Number));
}
// Normalizes an IPO name for matching during sync, so "Orient Cables (India)
// IPO" and "Orient Cables IPO" are recognized as the same company instead of
// creating a duplicate entry — strips the word IPO, "(India)"-style
// parentheticals, Ltd/Limited, punctuation, and extra whitespace.
function normalizeIpoName(name){
  return String(name||'')
    .toLowerCase()
    .replace(/\(.*?\)/g, ' ')
    .replace(/\b(ipo|limited|ltd|pvt|private)\b/g, ' ')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

/* ---------- CLOUD SYNC (Firebase Auth + Firestore) ----------
   Local IndexedDB stays the source of truth for rendering and for
   offline/not-signed-in use. When signed in, every idbPut/idbDelete also
   mirrors to this user's own Firestore documents (users/{uid}/{store}/{id}),
   and signing in pulls the cloud copy down into IndexedDB. Two devices
   signed into the same account each sync independently to the same cloud
   documents — there's no realtime push between them in this version, so
   switching devices should be followed by reopening the app (which re-pulls)
   rather than expecting instant cross-device updates while both are open. */
const firebaseConfig = {
  apiKey: "AIzaSyC26NOO58bugtOnH01k7FMxTIoFT5SfxpY",
  authDomain: "ipo-ledger-37381.firebaseapp.com",
  projectId: "ipo-ledger-37381",

  appId: "1:1041751927489:web:c82d76322890f347fc0240",
  measurementId: "G-Q2G9JH3V5D"
};
let fbApp = null, fbAuth = null, fbDb = null, fbReady = false;
function initFirebase(){
  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbReady = true;
  }catch(e){
    console.error('Firebase init failed — cloud sync disabled, app still works locally', e);
    fbReady = false;
  }
}
function userDocRef(store, id){
  return fbDb.collection('users').doc(State.user.uid).collection(store).doc(id);
}
async function cloudPut(store, obj){
  if(!fbReady || !State.user) return; // not signed in — local-only, nothing to push
  try{ await userDocRef(store, obj.id).set(obj); }
  catch(e){ console.error('Cloud sync (put) failed for', store, obj.id, e); }
}
async function cloudDelete(store, id){
  if(!fbReady || !State.user) return;
  try{ await userDocRef(store, id).delete(); }
  catch(e){ console.error('Cloud sync (delete) failed for', store, id, e); }
}
async function cloudPullAll(){
  if(!fbReady || !State.user) return;
  State.cloudSyncing = true; render();
  try{
    for(const store of SYNCABLE_STORES){
      const localDocs = await idbAll(store);
      const localIds = new Set(localDocs.map(d=>d.id));
      const snap = await fbDb.collection('users').doc(State.user.uid).collection(store).get();
      const cloudDocs = snap.docs.map(d=>d.data());
      const cloudIds = new Set(cloudDocs.map(d=>d.id));
      // Pull: cloud data wins per-document (last writer across devices) for
      // anything that exists in both places.
      for(const doc of cloudDocs) await idbPutLocalOnly(store, doc);
      // Push: anything that exists locally but not yet in the cloud — this
      // is what makes "I already had local data before signing in" work,
      // on this device's very first sign-in. After that first sync this
      // loop finds nothing new and is a cheap no-op.
      const localOnly = localDocs.filter(d=>!cloudIds.has(d.id));
      for(const doc of localOnly) await cloudPut(store, doc);
    }
    await loadAll();
    State.lastCloudSync = { ok: true, at: new Date().toISOString() };
  }catch(e){
    console.error('Cloud pull failed', e);
    State.lastCloudSync = { ok: false, at: new Date().toISOString() };
  }
  State.cloudSyncing = false; render();
}
// Used only during a cloud pull, so merging cloud data in doesn't re-trigger
// a redundant push right back up to the same cloud documents.
function idbPutLocalOnly(store, obj){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').put(obj);
    req.onsuccess = ()=>resolve(obj);
    req.onerror = reject;
  });
}
async function signInWithGoogle(){
  if(!fbReady){ toast('Cloud sign-in is unavailable right now'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    if(isStandalone()){
      // Installed home-screen apps (especially iOS) have a well-documented
      // history of signInWithPopup silently never resolving — the popup
      // opens as a window the standalone context can't get a result back
      // from. Redirect is the safer choice specifically in this mode.
      await fbAuth.signInWithRedirect(provider);
      // Execution continues after the app reloads post-redirect; the
      // result is picked up by getRedirectResult() in boot().
    } else {
      await fbAuth.signInWithPopup(provider);
      // onAuthStateChanged below handles the rest (setting State.user, pulling data)
    }
  }catch(e){
    console.error('Sign-in failed', e);
    toast('Sign-in failed or was cancelled');
  }
}
async function signOutOfCloud(){
  if(!fbReady) return;
  try{ await fbAuth.signOut(); toast('Signed out — your data stays on this device'); render(); }
  catch(e){ console.error('Sign-out failed', e); }
}

/* ---- GMP rule + trend + last-apply memory ---- */
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function gmpRule(){ const r=lsGet('ipoledger_gmprule',{}); return { apply: Number(r.apply)||15, skip: (r.skip===0||r.skip)?Number(r.skip):5 }; }
function gmpTag(ipo){                       // Apply / Maybe / Skip — only for IPOs you can still apply to
  const k = ipoStatus(ipo).key;
  if(k!=='open' && k!=='closing' && k!=='upcoming') return '';
  if(ipo.gmpPercent==null || ipo.gmpPercent==='') return '';
  const g = Number(ipo.gmpPercent), r = gmpRule();
  const [t,c] = g>=r.apply ? ['Apply','var(--green)'] : g>=r.skip ? ['Maybe','var(--gold)'] : ['Skip','var(--rust)'];
  return `<span class="gmptag" style="color:${c};border-color:${c};">${t}</span>`;
}
function gmpTrend(ipo){                     // GMP % now, and change vs the previous day's reading
  if(ipo.gmpPercent==null || ipo.gmpPercent==='') return '';
  const h = (ipo.gmpHistory||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const now = Number(ipo.gmpPercent);
  let prev = null;
  for(let i=h.length-1;i>=0;i--){ if(h[i].gmpPercent!=null && h[i].date < todayStr()){ prev = Number(h[i].gmpPercent); break; } }
  const d = prev==null ? null : now-prev;
  const col = now>0?'var(--green)':now<0?'var(--rust)':'var(--ink-faint)';
  const arrow = d==null||Math.abs(d)<0.05 ? '' : d>0 ? `<span style="color:var(--green)"> ▲${d.toFixed(0)}</span>` : `<span style="color:var(--rust)"> ▼${Math.abs(d).toFixed(0)}</span>`;
  return `<span class="gmpchip tabular" style="color:${col};">GMP ${now>0?'+':''}${now}%${arrow}</span>`;
}
function daysSince(){ return 0; }
function lotGain(ipo){                       // estimated gain per lot at today's GMP
  const lot = Number(ipo.lotSize)||0; if(!lot) return null;
  let per = null;
  if(ipo.gmpPrice!=null && ipo.gmpPrice!=='') per = Number(ipo.gmpPrice);
  else if(ipo.gmpPercent!=null && ipo.gmpPercent!=='' && Number(ipo.maxPrice)>0) per = Number(ipo.maxPrice)*Number(ipo.gmpPercent)/100;
  if(per==null || isNaN(per)) return null;
  return Math.round(per*lot);
}

// Money movements affecting a bank: entered balance + transfers + applications (blocked) + refunds
function bankLedger(bankId){
  const bank = bankById(bankId);
  if(!bank) return { entries:[], current:0 };
  const entries = [];
  entries.push({ date: bank.createdDate||todayStr(), label:'Opening balance', amount: bank.openingBalance||0, running:0 });

  // transfers out/in
  State.transfers.forEach(t=>{
    if(t.fromBankId===bankId) entries.push({date:t.date, label:`Transfer to ${bankById(t.toBankId)?.name||'—'}`, amount:-t.amount});
    if(t.toBankId===bankId) entries.push({date:t.date, label:`Transfer from ${bankById(t.fromBankId)?.name||'—'}`, amount:t.amount});
  });

  // applications: blocked amount leaves bank when applied; refund/unblock returns money
  State.applications.filter(a=>a.bankId===bankId).forEach(a=>{
    const ipo = ipoById(a.ipoId);
    entries.push({ date:a.appliedDate, label:`${ipo?ipo.name:'IPO'} — applied (${applicantById(a.applicantId)?.name||'—'})`, amount:-(a.amount||0) });
    const refunded = a.refundedAmount||0;
    if(refunded>0){
      entries.push({ date:a.refundDate||a.appliedDate, label:`${ipo?ipo.name:'IPO'} — refund/unblock (${applicantById(a.applicantId)?.name||'—'})`, amount:refunded });
    }
  });

  entries.sort((x,y)=> (x.date||'').localeCompare(y.date||''));
  let running = 0;
  entries.forEach(e=>{ running += e.amount; e.running = running; });
  return { entries, current: running };
}

function bankAvailable(bankId){
  return bankLedger(bankId).current;
}
function bankBlocked(bankId){
  // sum of applications on this bank not yet refunded (pending amount)
  return State.applications.filter(a=>a.bankId===bankId).reduce((sum,a)=>{
    const applied = a.amount||0;
    const refunded = a.refundedAmount||0;
    return sum + Math.max(0, applied - refunded);
  },0);
}

function ipoStatus(ipo){
  const openD = daysDiff(ipo.openDate);
  const closeD = daysDiff(ipo.closeDate);
  const allotD = daysDiff(ipo.allotmentDate);
  const listD = daysDiff(ipo.listingDate);
  if(listD!==null && listD<=0) return {key:'listed', label: listD===0?'Listing today':'Listed'};
  if(listD===1) return {key:'listed', label:'Listing tomorrow'};
  if(allotD!==null && allotD<=0) return {key:'allot', label: allotD===0?'Allotment today':'Allotment out'};
  if(allotD===1) return {key:'allot', label:'Allotment tomorrow'};
  if(closeD!==null && closeD<0) return {key:'closed', label:'Closed'};
  if(closeD===0) return {key:'closing', label:'Closing today'};
  if(closeD===1) return {key:'closing', label:'Closing tomorrow'};
  if(openD!==null && openD<=0 && (closeD===null||closeD>=0)) return {key:'open', label:'Open now'};
  if(openD===1) return {key:'upcoming', label:'Opens tomorrow'};
  if(openD!==null && openD>1) return {key:'upcoming', label:`Opens in ${openD}d`};
  return {key:'closed', label:'—'};
}

function ipoApplications(ipoId){ return State.applications.filter(a=>a.ipoId===ipoId); }
function ipoLotAmount(ipo){
  if(!ipo) return 0;
  // Block price = (shares per lot) × (max price in the price band).
  // Prefer the explicit maxPrice field, but fall back to parsing the price
  // band text so an out-of-sync/blank maxPrice never silently zeroes this out.
  const maxPrice = Number(ipo.maxPrice) || parseMaxPriceFromBand(ipo.priceBand) || 0;
  const lot = Number(ipo.lotSize)||0;
  return maxPrice*lot;
}
function ipoTotalApplied(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.amount||0),0); }
function ipoTotalAllotted(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.allottedAmount||0),0); }
function ipoTotalRefunded(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.refundedAmount||0),0); }
function ipoTotalPending(ipoId){
  return ipoApplications(ipoId).reduce((s,a)=>{
    const applied=a.amount||0, allotted=a.allottedAmount||0, refunded=a.refundedAmount||0;
    // pending = applied - allotted - refunded (money not yet resolved), floor 0
    if(a.allotmentStatus==='pending') return s + Math.max(0, applied - refunded);
    return s;
  },0);
}

function totalBlockedAll(){
  return State.banks.reduce((s,b)=>s+bankBlocked(b.id),0);
}
function totalRefundPendingAll(){
  return State.applications.reduce((s,a)=>{
    if(a.allotmentStatus==='pending') return s;
    const applied=a.amount||0, allotted=a.allottedAmount||0, refunded=a.refundedAmount||0;
    const owed = applied - allotted; // amount that should eventually be refunded
    const stillPending = owed - refunded;
    return s + Math.max(0, stillPending);
  },0);
}
function totalProfitAll(){
  return State.sales.reduce((s,sale)=> s + ((sale.saleAmount||0) - (sale.investment||0) - (sale.charges||0)), 0);
}
function totalMoneyInBanks(){
  return State.banks.reduce((s,b)=>s+bankAvailable(b.id),0) + totalBlockedAll();
  // "total money in tracked banks" = available + blocked (i.e. total capital across banks)
}
function activeApplicationsCount(){
  // Active = allotment not yet decided. Once an application is marked
  // allotted or not allotted, the outcome is known and it's no longer
  // "active", even if the IPO itself hasn't listed yet.
  return State.applications.filter(a=> a.allotmentStatus==='pending').length;
}
function upcomingIposCount(){
  return State.ipos.filter(i=> ipoStatus(i).key==='upcoming').length;
}

/* fuzzy-ish partial match: all chars of query appear in order, or substring match on name/company */
function ipoMatches(ipo, q){
  q = q.trim().toLowerCase();
  if(!q) return true;
  const hay = (ipo.name+' '+(ipo.company||'')).toLowerCase();
  if(hay.includes(q)) return true;
  // subsequence fuzzy match
  let qi=0;
  for(let i=0;i<hay.length && qi<q.length;i++){ if(hay[i]===q[qi]) qi++; }
  return qi===q.length;
}

/* ---------- TOAST ---------- */
function toast(msg, opts){
  const root = document.getElementById('toast-root');
  const act = opts && opts.action;
  root.innerHTML = `<div class="toast">${esc(msg)}${act ? ` <button class="toast-act" id="toast-act">${esc(act.label)}</button>` : ''}</div>`;
  if(act){ document.getElementById('toast-act').addEventListener('click', ()=>{ root.innerHTML=''; clearTimeout(toast._t); act.fn(); }); }
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ root.innerHTML=''; }, (opts && opts.ms) || (act ? 6000 : 2600));
}

/* ---------- MODAL ---------- */
function closeModal(){
  const root = document.getElementById('modal-root');
  if(!root.innerHTML.trim()) return;      // already closed (guards against double calls)
  root.innerHTML='';
  const f = State._onModalClose; State._onModalClose = null;
  if(history.state && history.state.modal){ State._ignorePop = true; history.back(); }
  if(f) f();
}

  State._onModalClose = null;

const VALID_ROUTES = NAV.map(n=>n.key);
function go(route, {replace=false}={}){
  const deepApps = route==='applications' && State.appNav && State.appNav.ipoId;
  State.route = route;
  if(route==='applications') State.appNav = { ipoId:null, bankId:null };  // tapping the tab starts at the IPO list
  const hash = '#'+route;
  // Real history entries so the phone's Back button steps back through
  // what you actually did (tab -> drill-down levels -> allotment screen)
  // instead of jumping between tabs.
  if(replace || (location.hash === hash && !deepApps)) history.replaceState({route}, '', hash);
  else history.pushState({route}, '', hash);
  render();
  window.scrollTo(0,0);
}
window.addEventListener('popstate', (e)=>{
  if(State._ignorePop){ State._ignorePop = false; return; }   // we triggered this ourselves when closing the allotment screen
  const st = e.state || {};
  const mr = document.getElementById('modal-root');
  const hadModal = !!(mr && mr.innerHTML.trim());
  if(hadModal){ mr.innerHTML = ''; State._onModalClose = null; }   // Back closes the allotment screen first
  const route = st.route || (location.hash||'').replace('#','') || 'dashboard';
  const routeChanged = State.route !== route;
  State.route = VALID_ROUTES.includes(route) ? route : 'dashboard';
  State.appNav = st.nav ? { ipoId: st.nav.ipoId||null, bankId: st.nav.bankId||null } : { ipoId:null, bankId:null };
  const y = window.scrollY;
  render();
  if(hadModal && !routeChanged) window.scrollTo(0,y); else window.scrollTo(0,0);
});

/* ---------- BACKUP ---------- */
function exportBackup(){
  const data = {
    version:1, exportedAt:new Date().toISOString(),
    banks:State.banks, applicants:State.applicants, ipos:State.ipos,
    applications:State.applications, transfers:State.transfers, sales:State.sales,
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ipo-ledger-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exported');
}
function triggerImport(){
  const input = document.createElement('input');
  input.type='file'; input.accept='application/json';
  input.addEventListener('change', async ()=>{
    const file = input.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      openModal(`
        <div class="modal">
          <h3>Import backup?</h3>
          <p style="font-size:13px;color:var(--ink-dim);margin:0 0 6px;">This will replace ALL current data with the contents of this file. This cannot be undone.</p>
          <p style="font-size:12px;color:var(--ink-faint);">${(data.banks||[]).length} banks, ${(data.applicants||[]).length} applicants, ${(data.ipos||[]).length} IPOs, ${(data.applications||[]).length} applications.</p>
          <div class="modal-actions">
            <button class="btn ghost" data-close="1">Cancel</button>
            <button class="btn primary" id="confirm-import">Replace all data</button>
          </div>
        </div>`);
      document.getElementById('confirm-import').addEventListener('click', async ()=>{
        for(const s of ['banks','applicants','ipos','applications','transfers','sales']) await idbClear(s);
        for(const s of ['banks','applicants','ipos','applications','transfers','sales']){
          for(const item of (data[s]||[])) await idbPut(s, item);
        }
        await loadAll();
        closeModal(); toast('Backup imported'); render();
      });
    }catch(err){ toast('Invalid backup file'); }
  });
  input.click();
}

    <span class="attn-dot" style="background:${dotColor};"></span>
    <span class="attn-text">${esc(a.text)}</span>
    ${a.action==='allot' ? '<span class="attn-go">Open ›</span>' : ''}
  </div>`;
}
function renderIpoStrip(list){
  if(list.length===0) return `<div class="empty-state"><div class="t">No IPOs open right now</div></div>`;
  return `<div class="grid cols-2">${list.map(ipo=>ipoCard(ipo)).join('')}</div>`;
}
function ipoCard(ipo){
  const st = ipoStatus(ipo);
  const applied = ipoTotalApplied(ipo.id);
  return `<div class="card" style="cursor:pointer;" data-goto-ipo="${ipo.id}">
    <div class="row" style="align-items:flex-start;">
      <div style="min-width:0;">

      </div>

      ${ipo.gmpPercent!=null ? `<div style="font-size:12px;font-weight:600;color:${Number(ipo.gmpPercent)>0?'var(--green)':Number(ipo.gmpPercent)<0?'var(--rust)':'var(--ink-faint)'};">GMP ${Number(ipo.gmpPercent)>0?'+':''}${ipo.gmpPercent}%</div>` : ''}

/* ==================== APPLY / MANAGE ==================== */
function renderApply(main){
  const flow = State.applyFlow;
  const ipo = flow.ipoId ? ipoById(flow.ipoId) : null;

  main.innerHTML = `
    <h1 class="page-title">Apply / Manage IPO</h1>
    <p class="page-sub">Select IPO → select bank → tick applicants → mark applied</p>

    <div class="section-label">Select IPO</div>
    <div class="searchbox">
      <input type="text" id="ipo-search" placeholder="Search IPO by name..." autocomplete="off" value="${ipo?esc(ipo.name):''}">
      <div id="ipo-dropdown"></div>
    </div>

    <div id="ipo-hero-slot" style="margin-top:14px;"></div>
    <div id="bank-slot"></div>
    <div id="applicant-slot"></div>
  `;

  const searchInput = document.getElementById('ipo-search');
  const dropdown = document.getElementById('ipo-dropdown');

  function showDropdown(q){
    const matches = State.ipos.filter(i=>ipoMatches(i,q)).slice(0,12);
    // sort: open first, then upcoming, then rest
    matches.sort((a,b)=>{
      const order = {open:0, closing:0, upcoming:1, allot:0, listed:2, closed:3};
      return (order[ipoStatus(a).key]??4) - (order[ipoStatus(b).key]??4);
    });
    if(matches.length===0){
      dropdown.innerHTML = `<div class="searchdrop"><div class="empty">No IPOs found. <a href="#" id="qa-new-ipo" class="link">Add "${esc(q)}" as new IPO</a></div></div>`;
      dropdown.className='';
      const link = document.getElementById('qa-new-ipo');
      if(link) link.addEventListener('click',(e)=>{ e.preventDefault(); closeDropdown(); openIpoModal(null, q); });
      return;
    }
    dropdown.innerHTML = `<div class="searchdrop">${matches.map(i=>`
      <div class="opt" data-pick="${i.id}">
        <div>${esc(i.name)}</div>
        <div class="sub">${ipoStatus(i).label} · ${fmtDate(i.openDate)}–${fmtDate(i.closeDate)}</div>
      </div>`).join('')}</div>`;
    dropdown.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>{
      flow.ipoId = el.dataset.pick; flow.bankId=null; flow.selected=new Map(); flow.category='retail';
      closeDropdown();
      searchInput.value = ipoById(flow.ipoId).name;
      renderApplyDetails();
    }));
  }
  function closeDropdown(){ dropdown.innerHTML=''; }

  searchInput.addEventListener('focus', ()=> showDropdown(searchInput.value));
  searchInput.addEventListener('input', ()=> showDropdown(searchInput.value));
  document.addEventListener('click', function outside(e){
    if(!e.target.closest('.searchbox')){ closeDropdown(); }
  }, {once:true});

  function renderApplyDetails(){
    const heroSlot = document.getElementById('ipo-hero-slot');
    const bankSlot = document.getElementById('bank-slot');
    const applicantSlot = document.getElementById('applicant-slot');
    const ipo = flow.ipoId ? ipoById(flow.ipoId) : null;

    if(!ipo){ heroSlot.innerHTML=''; bankSlot.innerHTML=''; applicantSlot.innerHTML=''; return; }

    const st = ipoStatus(ipo);
    heroSlot.innerHTML = `
      <div class="ipo-hero">
        <div class="row" style="align-items:flex-start;">
          <div>
            <div class="name">${esc(ipo.name)}</div>
            <div class="company">${esc(ipo.company||'')}</div>
          </div>
          <span class="badge ${st.key}">${st.label}</span>
        </div>
        <div class="facts">
          <div class="f"><span>Open</span><b>${fmtDate(ipo.openDate)}</b></div>
          <div class="f"><span>Close</span><b>${fmtDate(ipo.closeDate)}</b></div>
          <div class="f"><span>Allotment${ipo.allotmentDate?'':' (tentative)'}</span><b>${fmtDate(ipo.allotmentDate||ipo.allotmentDateTentative)}</b></div>
          <div class="f"><span>Listing${ipo.listingDate?'':' (tentative)'}</span><b>${fmtDate(ipo.listingDate||ipo.listingDateTentative)}</b></div>
          <div class="f"><span>Lot size</span><b class="tabular">${ipo.lotSize?ipo.lotSize+' shares':'—'}</b></div>
          <div class="f"><span>Amount per lot</span><b class="tabular">${ipoLotAmount(ipo)?fmtMoney(ipoLotAmount(ipo)):'—'}</b></div>
          ${(ipo.gmpPercent!=null || ipo.gmpPrice!=null) ? `<div class="f"><span>GMP</span><b class="tabular" style="color:${Number(ipo.gmpPercent)>0?'var(--green)':Number(ipo.gmpPercent)<0?'var(--rust)':'var(--ink)'};">${ipo.gmpPrice!=null?'₹'+ipo.gmpPrice:''}${ipo.gmpPercent!=null?' ('+(Number(ipo.gmpPercent)>0?'+':'')+ipo.gmpPercent+'%)':''}</b></div>` : ''}
          ${lotGain(ipo)!=null ? `<div class="f"><span>Est. per lot</span><b class="tabular" style="color:${lotGain(ipo)>=0?'var(--green)':'var(--rust)'};">${lotGain(ipo)>=0?'+':'−'}${fmtMoney(Math.abs(lotGain(ipo)))}</b></div>` : ''}
          <div class="f"><span>Registrar</span><b>${ipo.registrar?esc(ipo.registrar):'Not set yet'}</b></div>
          ${ipo.ipoSize?`<div class="f"><span>IPO size</span><b>${esc(ipo.ipoSize)}</b></div>`:''}
        </div>
        ${(ipo.gmpHistory && ipo.gmpHistory.length>0) ? `<button class="btn sm ghost" id="view-gmp-history-btn" style="margin-top:14px;">${ICONS.external} GMP history (${ipo.gmpHistory.length} day${ipo.gmpHistory.length>1?'s':''})</button>` : ''}
      </div>
    `;
    const gmpHistBtn = document.getElementById('view-gmp-history-btn');
    if(gmpHistBtn) gmpHistBtn.addEventListener('click', ()=>openGmpHistoryModal(ipo));

    if(State.banks.length===0){
      bankSlot.innerHTML = `<div class="section-label">Select bank</div><div class="empty-state"><div class="t">No banks yet</div><div class="s">Add a bank in Settings/Banks first.</div></div>`;
      applicantSlot.innerHTML='';
      return;
    }

    bankSlot.innerHTML = `
      <div class="section-label">Select bank</div>
      <div class="grid cols-3">
        ${State.banks.map(b=>{
          const avail = bankAvailable(b.id);
          return `<div class="bankcard ${flow.bankId===b.id?'selected':''}" data-bank="${b.id}">
            <div class="bn">${esc(b.name)}</div>
            <div class="bb tabular">Available: ${fmtMoney(avail)}</div>
          </div>`;
        }).join('')}
      </div>
    `;
    bankSlot.querySelectorAll('[data-bank]').forEach(el=>el.addEventListener('click',()=>{
      flow.bankId = el.dataset.bank; flow.selected = new Map();
      renderApplyDetails();
    }));
    // "Same as last time": last bank + applicants you applied with, minus anyone already applied to this IPO
    const last = lsGet('ipoledger_lastapply', null);
    if(last && flow.selected.size===0 && bankById(last.bankId)){
      const already = new Set(State.applications.filter(a=>a.ipoId===ipo.id && (a.category||'retail')===(flow.category||'retail')).map(a=>a.applicantId));
      const minL = Math.max(1, Number(ipo.minLots)||1);
      const who = (last.people||[]).filter(pp=>applicantById(pp.id) && !already.has(pp.id));
      if(who.length){
        const q = document.createElement('button');
        q.className = 'btn ghost block'; q.style.cssText = 'margin-top:10px;justify-content:flex-start;text-align:left;';
        q.innerHTML = `↻ Same as last time — ${esc(bankById(last.bankId).name)} · ${who.length} applicant${who.length>1?'s':''}`;
        q.addEventListener('click',()=>{
          flow.bankId = last.bankId;
          flow.selected = new Map(who.map(pp=>[pp.id, Math.max(minL, Number(pp.lots)||1)]));
          renderApplyDetails();
        });
        bankSlot.appendChild(q);
      }
    }

    if(!flow.bankId){ applicantSlot.innerHTML=''; return; }

    const bank = bankById(flow.bankId);
    const avail = bankAvailable(bank.id);
    const blocked = bankBlocked(bank.id);
    const cat = flow.category || 'retail';
    const existingApps = State.applications.filter(a=>a.ipoId===ipo.id && (a.category||'retail')===cat);   // same person may apply once per category

    if(State.applicants.length===0){
      applicantSlot.innerHTML = `<div class="section-label">Select applicants</div><div class="empty-state"><div class="t">No applicants yet</div><div class="s">Add applicants first.</div></div>`;
      return;
    }

    const lotAmt = ipoLotAmount(ipo);
    const minLots = Math.max(1, Number(ipo.minLots)||1);

    applicantSlot.innerHTML = `
      <div class="row" style="margin-top:22px;">
        <div class="section-label" style="margin:0;">${esc(bank.name)}</div>
        <div style="font-size:12px;color:var(--ink-faint);" class="tabular">Available ${fmtMoney(avail)} · Blocked ${fmtMoney(blocked)}</div>
      </div>
      <div class="pill-tabs" style="margin:10px 0 8px;" id="cat-tabs">${CATEGORIES.map(([k,l])=>`<button data-cat="${k}" class="${cat===k?'active':''}">${l}</button>`).join('')}</div>
      ${minLots>1?`<div style="font-size:12px;color:var(--gold);margin-bottom:8px;">This is an SME IPO — minimum ${minLots} lots per application.</div>`:''}
      <div class="card" style="padding:6px 12px;">
        ${State.applicants.map(a=>{
          const existing = existingApps.find(e=>e.applicantId===a.id);
          const disabled = !!existing;
          const on = flow.selected.has(a.id);
          const lots = flow.selected.get(a.id) || minLots;
          return `<div class="check ${on?'on':''} ${disabled?'disabled':''}" data-applicant="${disabled?'':a.id}">
            <div class="box" data-tick="${a.id}" style="${disabled?'':'cursor:pointer;'}">${on||disabled?ICONS.check:''}</div>
            <div class="name" data-tick="${a.id}" style="${disabled?'':'cursor:pointer;'}">${esc(a.name)}</div>
            ${existing ? `<span class="tag">✅ Applied — ${esc(bankById(existing.bankId)?.name||'')}</span>` : on ? `
              <div style="display:flex;align-items:center;gap:6px;" data-lotctrl="${a.id}">
                <button class="iconbtn" data-lot-dec="${a.id}" style="border:1px solid var(--line);border-radius:6px;">−</button>
                <span class="tabular" style="min-width:52px;text-align:center;font-size:13px;">${lots} lot${lots>1?'s':''}</span>
                <button class="iconbtn" data-lot-inc="${a.id}" style="border:1px solid var(--line);border-radius:6px;">+</button>
              </div>
            ` : ''}
          </div>`;
        }).join('')}
      </div>
      <div id="apply-summary"></div>
    `;
    applicantSlot.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{ flow.category=b.dataset.cat; flow.selected=new Map(); renderApplyDetails(); }));
    applicantSlot.querySelectorAll('[data-tick]').forEach(el=>el.addEventListener('click',()=>{
      const id = el.dataset.tick;
      if(flow.selected.has(id)) flow.selected.delete(id); else flow.selected.set(id, minLots);
      renderApplyDetails();
    }));
    applicantSlot.querySelectorAll('[data-lot-inc]').forEach(el=>el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id = el.dataset.lotInc;
      flow.selected.set(id, (flow.selected.get(id)||minLots)+1);
      renderApplyDetails();
    }));
    applicantSlot.querySelectorAll('[data-lot-dec]').forEach(el=>el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id = el.dataset.lotDec;
      const next = Math.max(minLots, (flow.selected.get(id)||minLots)-1);
      flow.selected.set(id, next);
      renderApplyDetails();
    }));

    const count = flow.selected.size;
    const totalLots = Array.from(flow.selected.values()).reduce((s,n)=>s+n,0);
    const estTotal = totalLots*lotAmt;
    document.getElementById('apply-summary').innerHTML = count>0 ? `
      ${lotAmt===0 ? `<div style="font-size:12px;color:var(--rust);margin-top:14px;">This IPO has no lot size / max price set, so the amount will be recorded as ₹0. Edit the IPO first to set them accurately.</div>` : ''}
      <div class="row" style="margin-top:14px;">
        <div style="font-size:13px;color:var(--ink-dim);">${count} applicant${count>1?'s':''} · ${totalLots} lot${totalLots>1?'s':''} total</div>
        <div style="font-size:14px;font-weight:650;" class="tabular">${totalLots} × ${fmtMoney(lotAmt)} = ${fmtMoney(estTotal)}</div>
      </div>
      <button class="btn primary block" id="mark-applied-btn" style="margin-top:12px;">
        Mark selected as applied
      </button>
      ${estTotal>avail? `<div style="font-size:12px;color:var(--rust);margin-top:8px;">Amount exceeds available balance in ${esc(bank.name)} (${fmtMoney(avail)} available). You can still proceed if this is expected.</div>`:''}
    ` : '';
    const markBtn = document.getElementById('mark-applied-btn');
    if(markBtn) markBtn.addEventListener('click', ()=> markSelectedApplied(ipo, bank, lotAmt));
  }

  if(ipo) renderApplyDetails();
}

async function markSelectedApplied(ipo, bank, lotAmt){
  const flow = State.applyFlow;
  const entries = Array.from(flow.selected.entries()); // [applicantId, lots]
  let totalAmount = 0;
  const created = [];
  for(const [applicantId, lots] of entries){
    const amount = lots*lotAmt;
    totalAmount += amount;
    const app = {
      id: uid(), ipoId: ipo.id, applicantId, bankId: bank.id,
      lots, amount, appliedDate: todayStr(), category: flow.category || 'retail',
      allotmentStatus: 'pending', // pending | not_allotted | allotted
      allottedAmount: 0, refundedAmount: 0, refundDate: null,
    };
    await idbPut('applications', app);
    State.applications.push(app);
    created.push(app);
  }
  lsSet('ipoledger_lastapply', { bankId: bank.id, people: entries.map(([id,lots])=>({id, lots})) });
  flow.selected = new Map();
  toast(`✅ ${entries.length} marked applied — ${bank.name}, ${fmtMoney(totalAmount)}`, { ms:7000, action:{ label:'Undo', fn: async ()=>{
    for(const a of created){ await idbDelete('applications', a.id); }
    const ids = new Set(created.map(a=>a.id));
    State.applications = State.applications.filter(x=>!ids.has(x.id));
    toast('Undone'); render();
  } } });
  render();
  // restore flow state after full re-render
  State.applyFlow.ipoId = ipo.id; State.applyFlow.bankId = bank.id;
  go('apply');
}

/* ==================== APPLICATIONS (full list) ==================== */
function renderApplications(main){
  // Drill-down: IPO list -> banks within an IPO -> applicants within a bank.
  // Navigation state lives on `main` so it survives re-renders in this session.
  State.appNav = State.appNav || { ipoId:null, bankId:null };
  const nav = State.appNav;
  const apps = State.applications.slice().sort((a,b)=>(b.appliedDate||'').localeCompare(a.appliedDate||''));

  const sum = (list)=>list.reduce((t,a)=>t+(a.amount||0),0);
  const isPending = (a)=>a.allotmentStatus==='pending';

  // Guard against stale nav (IPO/bank deleted or last application removed)
  if(nav.ipoId && !apps.some(a=>a.ipoId===nav.ipoId)){ nav.ipoId=null; nav.bankId=null; }
  if(nav.bankId && !apps.some(a=>a.ipoId===nav.ipoId && a.bankId===nav.bankId)){ nav.bankId=null; }

  const backBar = (label, id)=>`
    <button class="btn" id="${id}" style="margin-bottom:12px;display:inline-flex;align-items:center;gap:6px;">
      ${ICONS.back}<span>${esc(label)}</span>
    </button>`;

  const row = (a)=>{
    const applicant = applicantById(a.applicantId);
    return `<div class="list-item">
      <div class="main" style="cursor:pointer;flex:1;" data-open-ipo="${a.ipoId}">
        <div class="title">${esc(applicant?applicant.name:'Unknown')}</div>
        <div class="meta tabular">${fmtDate(a.appliedDate)} · ${a.lots?a.lots+' lot'+(a.lots>1?'s':'')+' · ':''}${fmtMoney(a.amount)}${catTag(a)}</div>
      </div>
      ${allotmentBadge(a)}
      <div class="actions">
        <button class="iconbtn" data-unapply="${a.id}" title="Remove application">${ICONS.trash}</button>
      </div>
    </div>`;
  };

  // ---------- Level 1: IPOs ----------
  function viewIpos(){
    const groups = {};
    apps.forEach(a=>{ (groups[a.ipoId] = groups[a.ipoId] || []).push(a); });
    const entries = Object.keys(groups).map(id=>({ id, ipo:ipoById(id), list:groups[id] }));
    const active = entries.filter(e=>e.list.some(isPending));
    const past = entries.filter(e=>!e.list.some(isPending));
    const blocked = sum(apps.filter(isPending));

    const card = (e)=>{
      const pend = e.list.filter(isPending);
      const banks = new Set(e.list.map(a=>a.bankId)).size;
      return `<div class="list-item" style="cursor:pointer;" data-ipo="${e.id}">
        <div class="main" style="flex:1;">
          <div class="title">${esc(e.ipo?e.ipo.name:'Unknown IPO')}</div>
          <div class="meta tabular">${e.list.length} application${e.list.length!==1?'s':''} · ${banks} bank${banks!==1?'s':''} · ${fmtMoney(sum(e.list))}</div>
        </div>
        ${(pend.length && e.ipo && daysDiff(e.ipo.allotmentDate||e.ipo.allotmentDateTentative)!==null && daysDiff(e.ipo.allotmentDate||e.ipo.allotmentDateTentative)<=0)
          ? `<button class="btn sm primary" data-results="${e.id}">Results · ${pend.length}</button>`
          : `<div style="font-size:11.5px;color:${pend.length?'var(--seal)':'var(--ink-faint)'};font-weight:600;">${pend.length?pend.length+' pending':'Done'}</div>`}
      </div>`;
    };

    main.innerHTML = `
      <h1 class="page-title">Applications</h1>
            ${apps.length===0 ? `<div class="empty-state">${ICONS.list}<div class="t">No applications yet</div><div class="s">Mark some applications from Apply / Manage.</div></div>` : `
        <div class="row" style="margin-bottom:8px;">
          <div style="font-size:12.5px;color:var(--ink-faint);">${apps.filter(isPending).length} pending</div>
          <div style="font-size:13px;font-weight:600;" class="tabular">Blocked ${fmtMoney(blocked)}</div>
        </div>
        ${active.length ? `<div class="card" style="padding:6px 12px;">${active.map(card).join('')}</div>` : `<div class="empty-state"><div class="t">No pending applications</div></div>`}
        ${past.length ? `
          <details class="past-apps" style="margin-top:14px;">
            <summary>Past IPOs (${past.length})</summary>
            <div class="card" style="padding:6px 12px;margin-top:8px;">${past.map(card).join('')}</div>
          </details>` : ''}
      `}
    `;
    main.querySelectorAll('[data-ipo]').forEach(el=>el.addEventListener('click',()=>{ open(el.dataset.ipo, null); }));
    main.querySelectorAll('[data-results]').forEach(el=>el.addEventListener('click',(ev)=>{ ev.stopPropagation(); openAllotmentModal(el.dataset.results); }));
  }

  // ---------- Level 2: banks within an IPO ----------
  function viewBanks(){
    const ipo = ipoById(nav.ipoId);
    const list = apps.filter(a=>a.ipoId===nav.ipoId);
    const groups = {};
    list.forEach(a=>{ (groups[a.bankId] = groups[a.bankId] || []).push(a); });
    const cards = Object.keys(groups).sort((x,y)=>bankPos(x)-bankPos(y)).map(bid=>{
      const bank = bankById(bid); const g = groups[bid]; const pend = g.filter(isPending);
      return `<div class="list-item" style="cursor:pointer;" data-bank="${bid}">
        <div class="main" style="flex:1;">
          <div class="title">${esc(bank?bank.name:'Unknown bank')}</div>
          <div class="meta tabular">${g.length} applicant${g.length!==1?'s':''} · ${fmtMoney(sum(g))}</div>
        </div>
        <div style="font-size:11.5px;color:${pend.length?'var(--seal)':'var(--ink-faint)'};font-weight:600;">${pend.length?pend.length+' pending':'Done'}</div>
      </div>`;
    }).join('');
    main.innerHTML = `
      ${backBar('All IPOs','app-back')}
      <h1 class="page-title">${esc(ipo?ipo.name:'IPO')}</h1>
      <p class="page-sub">${list.length} application${list.length!==1?'s':''} · ${fmtMoney(sum(list))} · pick a bank</p>
      <div class="card" style="padding:6px 12px;">${cards}</div>
    `;
    document.getElementById('app-back').addEventListener('click',()=>{ history.back(); });
    main.querySelectorAll('[data-bank]').forEach(el=>el.addEventListener('click',()=>{ open(nav.ipoId, el.dataset.bank); }));
  }

  // ---------- Level 3: applicants within a bank ----------
  function viewApplicants(){
    const ipo = ipoById(nav.ipoId); const bank = bankById(nav.bankId);
    const list = apps.filter(a=>a.ipoId===nav.ipoId && a.bankId===nav.bankId).sort((x,y)=>(isPending(y)-isPending(x))||applicantPos(x.applicantId)-applicantPos(y.applicantId));
    const pend = list.filter(isPending);
    main.innerHTML = `
      ${backBar(ipo?ipo.name:'Back','app-back')}
      <h1 class="page-title">${esc(bank?bank.name:'Bank')}</h1>
      <p class="page-sub">${esc(ipo?ipo.name:'')} · ${list.length} applicant${list.length!==1?'s':''} · ${pend.length} pending · ${fmtMoney(sum(list))}</p>
      <div class="card" style="padding:6px 12px;">${list.map(row).join('')}</div>
    `;

/* ---- Bulk import of applicants (paste text / CSV) ---- */
function parseApplicantText(text){
  const PAN = /\b[A-Z]{5}[0-9]{4}[A-Z]\b/;
  const BO  = /\b(?:IN[0-9]{14}|[0-9]{16})\b/;
  const out = [];
  String(text||'').split(/\r?\n/).forEach(raw=>{
    let line = raw.replace(/^\s*(?:[-*•·☐☑✓✔]|\[[ xX]?\]|\d+[.)])\s*/,'').trim();
    if(!line) return;
    line = line.replace(/\b(\d{4})[ -](\d{4})[ -](\d{4})[ -](\d{4})\b/g,'$1$2$3$4');   // BO IDs written with spaces/dashes
    const up = line.toUpperCase();
    const pm = up.match(PAN), bm = up.match(BO);
    const pan = pm ? pm[0] : '', boid = bm ? bm[0] : '';
    let name = line;
    if(pan)  name = name.replace(new RegExp(pan,'i'),' ');
    if(boid) name = name.replace(new RegExp(boid,'i'),' ');
    name = name.replace(/\b(pan|bo\s?id|boid|demat|dp\s?id|client\s?id)\b/gi,' ')
               .replace(/[,;|\t:–—=]+/g,' ').replace(/\s-\s/g,' ').replace(/\s+/g,' ').trim();
    // leftover tokens that look like a damaged ID (digits mixed in, 6+ chars): keep them out of the name, show as a hint
    const keep=[], odd=[];
    name.split(' ').filter(Boolean).forEach(t=>{ if(/\d/.test(t) && t.replace(/[^A-Za-z0-9]/g,'').length>=6) odd.push(t); else keep.push(t); });
    name = keep.join(' '); const unclear = odd.join(' ');
    if(!pan && !boid && !unclear && (!name || /^name$/i.test(name))) return;       // blanks and CSV header rows
    out.push({ name, pan, boid, unclear });
  });
  // a name on one line and its ID alone on the next (common with wrapped/OCR'd lists): join them
  const merged = [];
  out.forEach(r=>{
    const prev = merged[merged.length-1];
    if(prev && prev.name && !prev.pan && !prev.boid && !prev.unclear && !r.name && (r.pan||r.boid||r.unclear)){ prev.pan=r.pan; prev.boid=r.boid; prev.unclear=r.unclear; }
    else merged.push(r);
  });
  return merged;
}


function loadScriptOnce(url){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-lib="${url}"]`)) return res();
    const el=document.createElement('script'); el.src=url; el.dataset.lib=url;
    el.onload=()=>res(); el.onerror=()=>rej(new Error('Could not load reader (check internet)'));
    document.head.appendChild(el);
  });
}
async function imageToCanvas(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(2400/bmp.width, Math.max(1, 1600/bmp.width));        // upscale small shots, cap huge ones
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
  const g = c.getContext('2d'); g.drawImage(bmp,0,0,c.width,c.height);
  const img = g.getImageData(0,0,c.width,c.height), d = img.data;
  let sum=0; for(let i=0;i<d.length;i+=4){ sum += (d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11); }
  const invert = (sum/(d.length/4)) < 120;                                    // dark-mode screenshots: light text on dark
  for(let i=0;i<d.length;i+=4){
    let v = d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11; if(invert) v = 255-v;
    v = Math.max(0,Math.min(255,(v-128)*1.4+128));                            // a little contrast
    d[i]=d[i+1]=d[i+2]=v;
  }
  g.putImageData(img,0,0);
  return c;
}
// Drop the icon junk OCR reads from checkboxes / drag handles at the start of a line, and placeholder rows
function cleanOcrLines(text){
  return String(text).split('\n').map(line=>{
    let toks = line.replace(/[\[\]()|_{}<>¢©®™•·]/g,' ').trim().split(/\s+/).filter(Boolean);
    while(toks.length>1 && (toks[0].length<=2 || /^[^A-Za-z]+$/.test(toks[0]))) toks.shift();   // e.g. "2", "J", "t"
    return toks.join(' ');
  }).filter(l=>l && !/^(list\s?item|title|add|note)$/i.test(l) && /[A-Za-z]{2,}|[0-9]{8,}/.test(l.replace(/\b\d{1,2}[:.]\d{2}\b/g,''))).join('\n');
}
// OCR often swaps look-alike characters (O/0, I/1, S/5…) and sometimes splits an ID with spaces;
// repair anything that clearly has the shape of a PAN or BO ID.
function fixOcrIds(text){
  const toD={O:'0',Q:'0',D:'0',I:'1',L:'1','|':'1',S:'5',B:'8',Z:'2'}, toL={'0':'O','1':'I','5':'S','8':'B','2':'Z'};
  const coercePan = (u)=>{
    if(u.length!==10) return null;
    const a=u.slice(0,5), b=u.slice(5,9), c=u[9];
    if(!(/^[A-Z0158]{5}$/.test(a) && (a.match(/[A-Z]/g)||[]).length>=3 && /^[0-9OQDILSBZ|]{4}$/.test(b) && (b.match(/[0-9]/g)||[]).length>=2 && /^[A-Z0158]$/.test(c))) return null;
    const f=[...a].map(ch=>toL[ch]||ch).join('')+[...b].map(ch=>toD[ch]||ch).join('')+(toL[c]||c);
    return /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(f) ? f : null;
  };
  const coerceBo = (u)=> (u.length===16 && /^[0-9OQDILSBZ|]{16}$/.test(u) && (u.match(/[0-9]/g)||[]).length>=10) ? [...u].map(ch=>toD[ch]||ch).join('') : null;
  const fixTok = (t)=>{ const u=t.toUpperCase(); return coercePan(u) || coerceBo(u) || t; };
  return String(text).split('\n').map(line=>{
    let toks = line.trim().split(/\s+/).filter(Boolean);
    const hasPan = toks.some(t=>coercePan(t.toUpperCase())), hasBo = toks.some(t=>coerceBo(t.toUpperCase()));
    const out=[];
    for(let i=0;i<toks.length;){
      let joined=null, used=0;
      for(let n=2;n<=5 && i+n<=toks.length;n++){                       // try gluing split pieces back together
        const u = toks.slice(i,i+n).join('').toUpperCase();
        if(!hasPan && coercePan(u)){ joined=coercePan(u); used=n; break; }
        if(!hasBo && coerceBo(u)){ joined=coerceBo(u); used=n; break; }
      }
      if(joined){ out.push(joined); i+=used; } else { out.push(fixTok(toks[i])); i++; }
    }
    return out.join(' ').replace(/^[^A-Za-z0-9]+/,'');
  }).join('\n');
}
async function fileToText(file, onProgress){
  const name=(file.name||'').toLowerCase();
  if(file.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|bmp)$/.test(name)){
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const canvas = await imageToCanvas(file);
    const worker = await Tesseract.createWorker('eng', 1, { logger: m=>{ if(onProgress && m.status) onProgress(m.status, m.progress); } });
    await worker.setParameters({ tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ', tessedit_pageseg_mode:'6', preserve_interword_spaces:'1' });
    const r = await worker.recognize(canvas); await worker.terminate();
    const text = r.data.text || '';
    return fixOcrIds(cleanOcrLines(text));
  }
  if(/\.(csv|txt)$/.test(name) || file.type.startsWith('text/')) return await file.text();
  if(/\.(xlsx|xls)$/.test(name)){
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const lines=[];
    wb.SheetNames.forEach(n=>{
      XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, blankrows:false, defval:''}).forEach(r=>{
        const l=r.map(c=>String(c).trim()).filter(Boolean).join(' ');
        if(l) lines.push(l);
      });
    });
    return lines.join('\n');
  }
  if(/\.pdf$/.test(name)){
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const lines=[];
    for(let pn=1; pn<=pdf.numPages; pn++){
      const tc = await (await pdf.getPage(pn)).getTextContent();
      const items = tc.items.filter(i=>i.str && i.str.trim()).map(i=>({t:i.str, x:i.transform[4], y:i.transform[5]}));
      items.sort((a,b)=>b.y-a.y || a.x-b.x);
      let cur=[], cy=null;
      items.forEach(i=>{
        if(cy!==null && Math.abs(i.y-cy)>3){ lines.push(cur.sort((a,b)=>a.x-b.x).map(z=>z.t).join(' ')); cur=[]; }
        cur.push(i); cy=i.y;
      });
      if(cur.length) lines.push(cur.sort((a,b)=>a.x-b.x).map(z=>z.t).join(' '));
    }
    return lines.join('\n');
  }
  throw new Error('Unsupported file type');
}

  function classify(parsed){
    const seen = new Set();
    return parsed.map(p=>{
      const lname = p.name.toLowerCase();
      const ex = State.applicants.find(a=> (p.pan && a.pan===p.pan) || (p.boid && a.boid===p.boid) || (lname && (a.name||'').toLowerCase()===lname));
      const key = p.pan || p.boid || lname;
      const repeat = seen.has(key); seen.add(key);
      let kind='new', note='New', on=true;
      if(repeat){ kind='skip'; note='Repeated in list'; on=false; }
      else if(ex){
        const conflict = (p.pan && ex.pan && p.pan!==ex.pan) || (p.boid && ex.boid && p.boid!==ex.boid);
        const adds = (p.pan && !ex.pan) || (p.boid && !ex.boid);
        if(conflict){ kind='skip'; note='Different ID from saved'; on=false; }
        else if(adds){ kind='update'; note='Adds missing ID'; on=true; }
        else { kind='skip'; note='Already added'; on=false; }
      } else if(!p.pan && !p.boid){ note='New · no ID'; }
      if(fromOcr && !p.pan && !p.boid && kind==='new'){ on=false; note=p.unclear?'ID unclear — fix below':'No ID found'; }
      return { ...p, ex, kind, note, on };
    });
  }

  function stepPreview(){
    const m = document.getElementById('imp-modal');
    const n = rows.filter(r=>r.on).length;
    m.innerHTML = `
      <div class="row" style="margin-bottom:6px;"><h3 style="margin:0;">Review (${rows.length})</h3>
        <button class="btn sm ghost" id="imp-back">‹ Edit text</button></div>
      ${fromOcr ? `<div class="set-sub" style="margin-bottom:8px;color:var(--gold);">⚠ Read from a photo — compare every PAN and BO ID with the original before saving. One wrong character breaks the allotment check.</div>` : ''}
      <div class="set-sub" style="margin-bottom:6px;">Untick anyone you don’t want. Fix names if the split looks wrong.</div>
      ${rows.map((r,i)=>`
        <div class="al-row">
          <input type="checkbox" data-imp-on="${i}" ${r.on?'checked':''} ${r.kind==='skip'&&r.note==='Already added'?'disabled':''} style="width:18px;height:18px;flex:none;">
          <div class="al-main">
            <input type="text" data-imp-name="${i}" value="${esc(r.name)}" placeholder="Name" style="width:100%;box-sizing:border-box;background:none;border:none;border-bottom:1px dashed var(--line);color:var(--ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:2px 0;outline:none;">
            <div class="imp-ids">
              <input type="text" data-imp-pan="${i}" value="${esc(r.pan)}" placeholder="PAN" maxlength="10" autocapitalize="characters" class="imp-id">
              <input type="text" data-imp-bo="${i}" value="${esc(r.boid)}" placeholder="BO ID" maxlength="16" autocapitalize="characters" class="imp-id">
            </div>
            ${r.unclear ? `<div class="set-sub" style="color:var(--gold);">Couldn’t read cleanly: “${esc(r.unclear)}” — check against the original</div>` : ''}
          </div>
          <span class="gmptag" style="color:${r.kind==='new'?'var(--green)':r.kind==='update'?'var(--gold)':'var(--ink-faint)'};border-color:currentColor;white-space:nowrap;">${esc(r.note)}</span>
        </div>`).join('')}
      <div class="modal-actions">
        <button class="btn ghost" data-close="1">Cancel</button>
        <button class="btn primary" id="imp-save">Add ${n} selected</button>
      </div>`;
    m.querySelectorAll('[data-imp-on]').forEach(el=>el.addEventListener('change',()=>{ rows[+el.dataset.impOn].on = el.checked; const b=document.getElementById('imp-save'); b.textContent='Add '+rows.filter(r=>r.on).length+' selected'; }));
    m.querySelectorAll('[data-imp-name]').forEach(el=>el.addEventListener('input',()=>{ rows[+el.dataset.impName].name = el.value; }));
    const PANRE=/^[A-Z]{5}[0-9]{4}[A-Z]$/, BORE=/^(?:IN[0-9]{14}|[0-9]{16})$/;
    const paint = (el,ok)=>{ el.style.borderColor = ok ? 'var(--line)' : 'var(--rust)'; };
    m.querySelectorAll('[data-imp-pan]').forEach(el=>{
      const chk=()=>{ el.value=el.value.toUpperCase().replace(/\s+/g,''); rows[+el.dataset.impPan].pan=el.value; paint(el, !el.value || PANRE.test(el.value)); };
      el.addEventListener('input',chk); chk();
    });
    m.querySelectorAll('[data-imp-bo]').forEach(el=>{
      const chk=()=>{ el.value=el.value.toUpperCase().replace(/\s+/g,''); rows[+el.dataset.impBo].boid=el.value; paint(el, !el.value || BORE.test(el.value)); };
      el.addEventListener('input',chk); chk();
    });
    document.getElementById('imp-back').addEventListener('click',()=>stepInput(rows.map(r=>[r.name,r.pan,r.boid].filter(Boolean).join(' ')).join('\n')));
    document.getElementById('imp-save').addEventListener('click', async ()=>{
      const bad = rows.filter(r=>r.on && ((r.pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(r.pan)) || (r.boid && !/^(?:IN[0-9]{14}|[0-9]{16})$/.test(r.boid))));
      if(bad.length){ toast(`Fix the red IDs first (${bad.length}) — or untick those people`); return; }
      if(rows.some(r=>r.on && !(r.name||'').trim())){ toast('Some ticked rows have no name — type one or untick them'); return; }
      let added=0, updated=0;
      for(const r of rows){
        if(!r.on) continue;
        const name = (r.name||'').trim();
        if(r.kind==='update' && r.ex){                       // only fill what's missing, never overwrite
          if(r.pan && !r.ex.pan) r.ex.pan = r.pan;
          if(r.boid && !r.ex.boid) r.ex.boid = r.boid;
          await idbPut('applicants', r.ex); updated++;
        } else if(r.kind==='new'){
          if(!name){ continue; }
          const obj = { id: uid(), name, pan: r.pan||'', boid: r.boid||'' };
          await idbPut('applicants', obj); State.applicants.push(obj); added++;
        }
      }
      closeModal();
      toast(`Added ${added}${updated?`, updated ${updated}`:''}`);
      render();
    });
  }

  openModal(`<div class="modal" id="imp-modal" style="max-width:520px;"></div>`);
  stepInput('');
}

/* ==================== IPOs ==================== */
const IPO_FEED_URL = 'https://raw.githubusercontent.com/emoce07/ipo-data/refs/heads/main/ipos.json';

function isoToDate(s){
  // accepts "YYYY-MM-DD" already, or falls through
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d)) return '';
  return d.toISOString().slice(0,10);
}

async function syncLiveIpos(silent){
  const btn = document.getElementById('sync-ipos-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  try{
    const res = await fetch(IPO_FEED_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const data = await res.json();
    const feed = Array.isArray(data.ipos) ? data.ipos : [];
    let added=0, updated=0;
    for(const item of feed){
      if(!item.name) continue;
      const itemKey = normalizeIpoName(item.name);
      const existing = State.ipos.find(i=> normalizeIpoName(i.name)===itemKey );
      const obj = existing || { id: uid() };
      obj.name = item.name;
      obj.company = item.company || obj.company || '';
      obj.openDate = isoToDate(item.openDate) || obj.openDate || '';
      obj.closeDate = isoToDate(item.closeDate) || obj.closeDate || '';
      obj.allotmentDate = isoToDate(item.allotmentDate) || obj.allotmentDate || '';
      obj.allotmentDateTentative = isoToDate(item.allotmentDateTentative) || obj.allotmentDateTentative || '';
      obj.refundDate = isoToDate(item.refundDate) || obj.refundDate || '';
      obj.listingDate = isoToDate(item.listingDate) || obj.listingDate || '';
      obj.listingDateTentative = isoToDate(item.listingDateTentative) || obj.listingDateTentative || '';
      obj.priceBand = item.priceBand || obj.priceBand || '';
      // maxPrice: trust an explicit non-zero value from the feed first;
      // otherwise derive it straight from the (just-updated) price band text,
      // so the block price recalculates every sync instead of staying stuck
      // at whatever it was the first time this IPO was added.
      obj.maxPrice = Number(item.maxPrice) || parseMaxPriceFromBand(obj.priceBand) || obj.maxPrice || 0;
      obj.lotSize = Number(item.lotSize)||obj.lotSize||0;
      obj.registrar = item.registrar || obj.registrar || '';
      obj.ipoSize = item.ipoSize || obj.ipoSize || '';
      obj.registrarUrl = item.registrarUrl || obj.registrarUrl || '';
      obj.notes = item.notes || obj.notes || '';
      obj.gmpPercent = (item.gmpPercent!=null && item.gmpPercent!=='') ? Number(item.gmpPercent) : (obj.gmpPercent ?? null);
      obj.gmpPrice = (item.gmpPrice!=null && item.gmpPrice!=='') ? Number(item.gmpPrice) : (obj.gmpPrice ?? null);
      // Date-wise GMP history, as published by the feed — the feed is the
      // source of truth here (it appends once per day server-side), so we
      // simply take whatever array it sends rather than merge entry-by-entry.
      if(Array.isArray(item.gmpHistory)) obj.gmpHistory = item.gmpHistory;
      obj.dataComplete = item.dataComplete!==false; // feed flags IPOs it couldn't fully fetch
      // IPO type: trust an explicit feed value; otherwise infer from the name
      // (InvestorGain typically labels SME issues directly in the name), and
      // never downgrade a type the user has already set manually.
      if(item.ipoType==='sme' || item.ipoType==='mainboard') obj.ipoType = item.ipoType;
      else if(!obj.ipoType) obj.ipoType = /\bsme\b/i.test(item.name) ? 'sme' : 'mainboard';
      obj.minLots = Number(item.minLots) || obj.minLots || 1;
      await idbPut('ipos', obj);
      if(existing) updated++; else { State.ipos.push(obj); added++; }
    }
    localStorage.setItem('ipo-feed-last-sync', new Date().toISOString());
    localStorage.setItem('ipo-feed-updated-at', data.updatedAt||'');
    // Run the SME tagging and duplicate-merge housekeeping automatically
    // after every sync, so neither needs a manual tap. SME tagging always
    // auto-applies (low-risk: only sets a type label). The duplicate merge
    // only auto-applies unambiguous cases; a genuine tie is left for the
    // manual "Find & merge" button in Settings.
    const smeTagged = await autoDetectSmeIposSilently();
    const dupeResult = await autoMergeDuplicateIposSilently();
    // A silent (automatic, background) sync only shows a toast if it
    // actually changed something — otherwise it'd produce a "Synced: 0
    // added, 0 updated" toast every single morning even when nothing is
    // new, which would be noise rather than useful.
    const extras = [];
    if(smeTagged>0) extras.push(`${smeTagged} tagged SME`);
    if(dupeResult.merged>0) extras.push(`${dupeResult.merged} duplicate(s) merged`);
    if(!silent || added>0 || updated>0 || extras.length>0){
      toast(`Synced: ${added} added, ${updated} updated${extras.length?' · '+extras.join(', '):''}`);
    }
    render();
  }catch(err){
    console.error(err);
    if(!silent) toast('Sync failed — check the feed URL or your connection');
    if(btn){ btn.disabled=false; btn.textContent = 'Sync live IPOs'; }
  }
}

function renderIpos(main){
  State._ipoTab = State._ipoTab || 'active';
  State._ipoTypeTab = State._ipoTypeTab || 'mainboard';
  const tab = State._ipoTab;
  const typeTab = State._ipoTypeTab;
  const lastSync = localStorage.getItem('ipo-feed-last-sync');
  const feedUpdatedAt = localStorage.getItem('ipo-feed-updated-at');
  const smeCount = State.ipos.filter(i=>i.ipoType==='sme').length;
  const mainboardCount = State.ipos.length - smeCount;
  const incompleteCount = State.ipos.filter(i=>i.dataComplete===false).length;
  main.innerHTML = `
    <div class="row"><h1 class="page-title">IPOs</h1>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" id="sync-ipos-btn">${ICONS.download} Sync live IPOs</button>
        <button class="btn primary" id="add-ipo">${ICONS.plus} Add IPO</button>
      </div>
    </div>
    <p class="page-sub">Manage IPO details, dates and registrar info
      ${lastSync ? ` · Last synced ${new Date(lastSync).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${feedUpdatedAt?` (feed dated ${feedUpdatedAt})`:''}` : ' · Not synced yet'}
    </p>
    ${incompleteCount>0 ? `<div class="card" style="border-color:var(--rust);margin-bottom:14px;padding:12px 14px;"><span style="font-size:13px;">⚠️ ${incompleteCount} IPO${incompleteCount>1?'s are':' is'} missing price/lot size from the live feed (shown with a "Needs info" tag below) — these can't be auto-classified as SME or correctly blocked until the source site publishes that data.</span></div>` : ''}
    <div class="pill-tabs">
      <button data-type-tab="mainboard" class="${typeTab==='mainboard'?'active':''}">Mainboard (${mainboardCount})</button>
      <button data-type-tab="sme" class="${typeTab==='sme'?'active':''}">SME (${smeCount})</button>
    </div>
    <div class="pill-tabs">
      <button data-tab="active" class="${tab==='active'?'active':''}">Active & upcoming</button>
      <button data-tab="all" class="${tab==='all'?'active':''}">All</button>
    </div>
    <input type="search" id="ipo-search" class="ipo-search" placeholder="Search IPOs" value="${esc(State._ipoQuery||'')}" autocomplete="off">
    <div id="ipo-list"></div>
  `;
  document.getElementById('add-ipo').addEventListener('click',()=>openIpoModal(null));
  document.getElementById('sync-ipos-btn').addEventListener('click', ()=>syncLiveIpos(false));
  main.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ State._ipoTab=b.dataset.tab; renderIpos(main); }));
  main.querySelectorAll('[data-type-tab]').forEach(b=>b.addEventListener('click',()=>{ State._ipoTypeTab=b.dataset.typeTab; renderIpos(main); }));
  const listEl = document.getElementById('ipo-list');
  function drawList(){
  const q = (State._ipoQuery||'').trim().toLowerCase();
  let list = State.ipos.filter(i=> (i.ipoType||'mainboard')===typeTab );
  let hiddenOld = 0;
  if(q){
    list = list.filter(i=>(i.name||'').toLowerCase().includes(q));      // search looks through every IPO, old ones included
  } else if(tab==='active'){
    list = list.filter(i=>ipoStatus(i).key!=='listed' && ipoStatus(i).key!=='closed');
  } else {
    // "All": only IPOs that closed within the last 7 days (or are still open/upcoming),
    // plus any with an allotment still pending. Older ones stay one tap away.
    const d = new Date(); d.setDate(d.getDate()-7);
    const cutoff = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const keep = (i)=> !i.closeDate || i.closeDate>=cutoff || ipoApplications(i.id).some(a=>a.allotmentStatus==='pending');
    const kept = list.filter(keep);
    hiddenOld = list.length - kept.length;
    if(!State._ipoShowOlder) list = kept;
  }
  // Order: open now (closing soonest first) -> upcoming (opening soonest first) -> closed (most recently closed first)
  const t0 = new Date(); const tod = t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0')+'-'+String(t0.getDate()).padStart(2,'0');
  const rank = (i)=>{
    if(i.openDate && i.openDate>tod) return 1;                       // upcoming
    if(i.closeDate && i.closeDate>=tod) return 0;                    // open now (includes closing today)
    if(i.closeDate) return 2;                                        // closed
    return i.openDate ? 0 : 3;                                       // no close date: treat as open if it has opened; else last
  };
  list.sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    if(ra===0) return (a.closeDate||'9999').localeCompare(b.closeDate||'9999');
    if(ra===1) return (a.openDate||'').localeCompare(b.openDate||'');
    return (b.closeDate||'').localeCompare(a.closeDate||'') || (b.openDate||'').localeCompare(a.openDate||'');
  });
  listEl.innerHTML = list.length===0 ? `<div class="empty-state">${ICONS.ipo}<div class="t">No ${typeTab==='sme'?'SME':'Mainboard'} IPOs here</div><div class="s">Add one, or switch tabs / sync live IPOs.</div></div>` : `
    <div class="card" style="padding:6px 12px;">
      ${list.map(ipo=>{
        const st = ipoStatus(ipo);
        return `<div class="list-item">
          <div class="main" style="cursor:pointer;flex:1;" data-view-ipo="${ipo.id}">
            <div class="title">${esc(ipo.name)}</div>
            <div class="meta">${fmtDate(ipo.openDate)}–${fmtDate(ipo.closeDate)} · ${ipoApplications(ipo.id).length} applications${ipo.registrar?' · '+esc(ipo.registrar):''}</div>
            ${(gmpTrend(ipo)||gmpTag(ipo)||lotGainChip(ipo)) ? `<div style="margin-top:4px;display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;">${gmpTrend(ipo)}${lotGainChip(ipo)}${gmpTag(ipo)}</div>` : ''}
          </div>
          ${ipo.dataComplete===false ? `<span class="badge closing" title="Price or lot size missing from the feed">Needs info</span>` : ''}
          <span class="badge ${st.key}">${st.label}</span>
          <div class="actions">
            <button class="iconbtn" data-edit-ipo="${ipo.id}">${ICONS.edit}</button>
            <button class="iconbtn" data-del-ipo="${ipo.id}">${ICONS.trash}</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${(tab==='all' && !q && (hiddenOld>0 || State._ipoShowOlder)) ? `<button class="btn ghost" id="toggle-older" style="width:100%;margin-top:10px;">${State._ipoShowOlder?'Hide older IPOs':'Show '+hiddenOld+' older IPO'+(hiddenOld!==1?'s':'')}</button>` : ''}
  `;
  const tg = document.getElementById('toggle-older');
  if(tg) tg.addEventListener('click',()=>{ State._ipoShowOlder = !State._ipoShowOlder; drawList(); });
  listEl.querySelectorAll('[data-edit-ipo]').forEach(el=>el.addEventListener('click',()=>openIpoModal(ipoById(el.dataset.editIpo))));
  listEl.querySelectorAll('[data-del-ipo]').forEach(el=>el.addEventListener('click',()=>confirmDeleteIpo(el.dataset.delIpo)));
  listEl.querySelectorAll('[data-view-ipo]').forEach(el=>el.addEventListener('click',()=>{ go('apply'); State.applyFlow={ipoId:el.dataset.viewIpo, bankId:null, selected:new Map()}; render(); }));
  }
  drawList();
  document.getElementById('ipo-search').addEventListener('input', (e)=>{ State._ipoQuery = e.target.value; drawList(); });
}
