async function findDuplicateIpos(){
  const groups = new Map(); // normalizedKey -> [ipo, ipo, ...]
  for(const ipo of State.ipos){
    const key = normalizeIpoName(ipo.name);
    if(!key) continue;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ipo);
  }
  return Array.from(groups.values()).filter(g=>g.length>1);
}
// Runs after each sync with no popup. Only merges a pair when one entry
// strictly outscores the other on data completeness — an unambiguous case.
// A genuine tie is left alone for the manual "Find & merge" button in
// Settings, since picking one of two equally-complete entries isn't a call
// this should make silently.
async function autoMergeDuplicateIposSilently(){
  const dupeGroups = await findDuplicateIpos();
  if(dupeGroups.length===0) return { merged: 0, apps: 0 };
  const scoreIpo = (ipo) => (ipo.lotSize>0?1:0) + (ipo.maxPrice>0?1:0) + (ipo.gmpPercent!=null?1:0) + (ipo.registrar?1:0);
  let merged = 0, mergedApps = 0;
  for(const group of dupeGroups){
    const sorted = [...group].sort((a,b)=> scoreIpo(b)-scoreIpo(a));
    const [keep, ...rest] = sorted;
    if(scoreIpo(sorted[0]) === scoreIpo(sorted[1])) continue; // genuine tie — leave for manual review
    for(const removedIpo of rest){
      const apps = State.applications.filter(a=>a.ipoId===removedIpo.id);
      for(const app of apps){
        app.ipoId = keep.id;
        await idbPut('applications', app);
        mergedApps++;
      }
      await idbDelete('ipos', removedIpo.id);
      State.ipos = State.ipos.filter(i=>i.id!==removedIpo.id);
      merged++;
    }
  }
  return { merged, apps: mergedApps };
}
async function mergeDuplicateIpos(){
  const dupeGroups = await findDuplicateIpos();
  if(dupeGroups.length===0){
    toast('No duplicate IPOs found');
    return;
  }
  // For each group, suggest keeping whichever entry has more data filled in
  // (non-zero lot size / price / gmp beats a blank placeholder entry) —
  // shown to the user to confirm, never applied silently.
  const scoreIpo = (ipo) => (ipo.lotSize>0?1:0) + (ipo.maxPrice>0?1:0) + (ipo.gmpPercent!=null?1:0) + (ipo.registrar?1:0);
  const plans = dupeGroups.map(group=>{
    const sorted = [...group].sort((a,b)=> scoreIpo(b)-scoreIpo(a));
    return { keep: sorted[0], remove: sorted.slice(1) };
  });

  openModal(`
    <div class="modal" style="max-width:520px;">
      <h3>${dupeGroups.length} duplicate IPO${dupeGroups.length>1?'s':''} found</h3>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;">These look like the same IPO saved twice (usually because sync used a slightly different name before). The entry with more data filled in is kept; the other is removed.</p>
      <div style="display:flex;flex-direction:column;gap:12px;max-height:320px;overflow-y:auto;">
        ${plans.map((p,idx)=>{
          const appsOnRemoved = p.remove.reduce((s,r)=>s+ipoApplications(r.id).length, 0);
          return `
          <div class="card" style="padding:12px;">
            <div style="font-size:12px;color:var(--green);margin-bottom:4px;">✅ Keep: ${esc(p.keep.name)}</div>
            <div class="meta tabular" style="margin-bottom:8px;">Lot size ${p.keep.lotSize||'—'} · Max price ${p.keep.maxPrice?fmtMoney(p.keep.maxPrice):'—'}${p.keep.gmpPercent!=null?' · GMP '+p.keep.gmpPercent+'%':''}</div>
            ${p.remove.map(r=>`<div style="font-size:12px;color:var(--rust);">❌ Remove: ${esc(r.name)}</div>`).join('')}
            ${appsOnRemoved>0?`<div style="font-size:11.5px;color:var(--gold);margin-top:6px;">⚠️ ${appsOnRemoved} application(s) on the removed entry will be moved to the kept one, not lost.</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close="1">Cancel</button>
        <button class="btn primary" id="confirm-merge-dupes">Merge duplicates</button>
      </div>
    </div>
  `);
  document.getElementById('confirm-merge-dupes').addEventListener('click', async ()=>{
    let mergedApps = 0;
    for(const p of plans){
      for(const removedIpo of p.remove){
        // Re-point any applications from the removed IPO to the kept one,
        // so nothing a user already recorded gets silently dropped.
        const apps = State.applications.filter(a=>a.ipoId===removedIpo.id);
        for(const app of apps){
          app.ipoId = p.keep.id;
          await idbPut('applications', app);
          mergedApps++;
        }
        await idbDelete('ipos', removedIpo.id);
        State.ipos = State.ipos.filter(i=>i.id!==removedIpo.id);
      }
    }
    closeModal();
    toast(`Merged ${dupeGroups.length} duplicate${dupeGroups.length>1?'s':''}${mergedApps>0?`, moved ${mergedApps} application(s)`:''}`);
    render();
  });
}
// Runs after each sync with no popup — tags every IPO whose amount-per-lot
// clears the SME threshold. Nothing is deleted here (only a type label is
// set), so unlike the duplicate merge this is low-risk enough to always
// auto-apply; the manual button + checklist in Settings still exists to
// review or correct any tag afterward.
async function autoDetectSmeIposSilently(){
  const SME_THRESHOLD = 90000;
  const checkable = State.ipos.filter(i=> (i.ipoType||'mainboard')==='mainboard');
  const candidates = checkable.filter(i=> ipoLotAmount(i) >= SME_THRESHOLD);
  for(const ipo of candidates){
    ipo.ipoType = 'sme';
    if(!ipo.minLots || ipo.minLots<2) ipo.minLots = 2;
    await idbPut('ipos', ipo);
  }
  return candidates.length;
}
async function autoDetectSmeIpos(){
  const SME_THRESHOLD = 90000; // amount-per-lot above this is almost always SME, not mainboard
  // Re-check every IPO currently marked mainboard (including the sync's own
  // weaker name-based guess), not just ones with no type at all — the amount
  // check here is more reliable than the sync's "SME in the name" heuristic.
  const checkable = State.ipos.filter(i=> (i.ipoType||'mainboard')==='mainboard');
  const candidates = checkable.filter(i=> ipoLotAmount(i) >= SME_THRESHOLD);
  const skippedNoAmount = checkable.filter(i=> ipoLotAmount(i)===0);

  if(candidates.length===0){
    toast(skippedNoAmount.length>0
      ? `No clear SME matches — ${skippedNoAmount.length} IPO(s) have no price/lot size set yet, so they can't be checked`
      : 'No untagged SME IPOs found — nothing to change');
    return;
  }
  openModal(`
    <div class="modal">
      <h3>Tag ${candidates.length} IPO${candidates.length>1?'s':''} as SME?</h3>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;">These have an amount per lot of ₹${(SME_THRESHOLD).toLocaleString('en-IN')}+, which is the SME norm (mainboard lots are usually ~₹15,000). Untick any that are wrong:</p>
      <div class="card" style="padding:4px 12px;max-height:220px;overflow-y:auto;">
        ${candidates.map(i=>`
          <label class="check" style="padding:8px 4px;">
            <input type="checkbox" class="sme-fix-check" data-sme-id="${i.id}" checked style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;">
            <span class="name">${esc(i.name)}</span>
            <span class="tag tabular">${fmtMoney(ipoLotAmount(i))}</span>
          </label>
        `).join('')}
      </div>
      ${skippedNoAmount.length>0?`<p style="font-size:12px;color:var(--ink-faint);margin-top:10px;">${skippedNoAmount.length} other untagged IPO(s) have no price/lot size entered, so couldn't be checked — tag those manually once you fill in their details.</p>`:''}
      <p style="font-size:12px;color:var(--ink-faint);margin-top:6px;">This is a heuristic based on amount, not certain.</p>
      <div class="modal-actions">
        <button class="btn ghost" data-close="1">Cancel</button>
        <button class="btn primary" id="confirm-sme-fix">Tag selected as SME</button>
      </div>
    </div>
  `);
  document.getElementById('confirm-sme-fix').addEventListener('click', async ()=>{
    const checked = Array.from(document.querySelectorAll('.sme-fix-check:checked')).map(el=>el.dataset.smeId);
    const toTag = candidates.filter(i=>checked.includes(i.id));

      await idbPut('ipos', ipo);
    }
    closeModal();
    toast(toTag.length>0 ? `Tagged ${toTag.length} IPO${toTag.length>1?'s':''} as SME` : 'No changes made');
    render();
  });
}

  // by IPO
  const byIpo = {};
  sales.forEach(x=>{ const g=(byIpo[x.ipoId]=byIpo[x.ipoId]||{ipoId:x.ipoId,inv:0,sold:0,chg:0,n:0,rows:[],last:''}); g.inv+=x.investment||0; g.sold+=x.saleAmount||0; g.chg+=x.charges||0; g.n++; g.rows.push(x); if((x.saleDate||'')>g.last) g.last=x.saleDate||''; });

          <button class="btn sm ghost" data-sell="${a.id}">Record sale</button></div>`; }).join('')}

          </div>
          <span class="badge ${st.key}">${st.label}</span>
        </div>`;
      }).join('')}
    </div>
  `;
  document.querySelectorAll('[data-open-allot]').forEach(el=>el.addEventListener('click',()=>openAllotmentModal(el.dataset.openAllot)));

  const searchInput = document.getElementById('global-search');
  const resultsEl = document.getElementById('global-results');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ resultsEl.innerHTML=''; return; }
    const ipoHits = State.ipos.filter(i=>ipoMatches(i,q));
    const bankHits = State.banks.filter(b=>b.name.toLowerCase().includes(q));
    const applicantHits = State.applicants.filter(a=>a.name.toLowerCase().includes(q));
    let html = '';
    if(applicantHits.length){
      applicantHits.forEach(ap=>{
        const apps = State.applications.filter(a=>a.applicantId===ap.id);
        html += `<div class="card" style="margin-bottom:10px;"><div style="font-weight:600;margin-bottom:8px;">${esc(ap.name)}</div>
          ${apps.map(a=>{ const ipo=ipoById(a.ipoId), bank=bankById(a.bankId); return `<div class="meta" style="padding:4px 0;">${esc(ipo?ipo.name:'—')} — ${esc(bank?bank.name:'—')} — ${allotmentBadge(a)}</div>`; }).join('') || `<div class="meta">No applications</div>`}
        </div>`;
      });
    }
    if(bankHits.length){
      bankHits.forEach(b=>{
        const apps = State.applications.filter(a=>a.bankId===b.id);
        html += `<div class="card" style="margin-bottom:10px;"><div style="font-weight:600;margin-bottom:8px;">${esc(b.name)}</div>
          ${apps.map(a=>{ const ipo=ipoById(a.ipoId); return `<div class="meta tabular" style="padding:4px 0;">${esc(ipo?ipo.name:'—')} — ${fmtMoney(a.amount)}</div>`; }).join('') || `<div class="meta">No applications</div>`}
        </div>`;
      });
    }
    if(ipoHits.length){
      html += `<div class="card"><div style="font-weight:600;margin-bottom:8px;">IPOs</div>${ipoHits.map(i=>`<div class="meta" style="padding:4px 0;cursor:pointer;" data-open-allot="${i.id}">${esc(i.name)} — ${ipoStatus(i).label}</div>`).join('')}</div>`;
    }
    resultsEl.innerHTML = html || `<div class="empty-state"><div class="t">No matches</div></div>`;
    resultsEl.querySelectorAll('[data-open-allot]').forEach(el=>el.addEventListener('click',()=>openAllotmentModal(el.dataset.openAllot)));
  });
}
// Registrar portals require manually selecting the IPO and solving a CAPTCHA —
// no registrar publishes a URL parameter to prefill PAN or skip this, so these
// are just the correct homepage to land on; PAN is copied to the clipboard
// separately so at least that part doesn't need retyping.
// Deliberately no "default" key — the live data feed does not provide
// registrar info (confirmed against the API's own documented field list),
// so guessing a default silently sends people to the wrong registrar's
// site. Unknown registrar always routes through openRegistrarUnknownModal
// instead, which asks rather than assumes.
const REGISTRAR_FALLBACK_URLS = {
  'KFin Technologies': 'https://ipostatus.kfintech.com',
  'KFintech': 'https://ipostatus.kfintech.com',
  'Link Intime': 'https://in.mpms.mufg.com/Initial_Offer/public-issues.html',
  'MUFG Intime': 'https://in.mpms.mufg.com/Initial_Offer/public-issues.html',
  'Bigshare Services': 'https://ipo.bigshareonline.com/ipo_status.html',
  'Bigshare': 'https://ipo.bigshareonline.com/ipo_status.html',
  'Cameo Corporate Services': 'https://ipo.cameoindia.com/',
  'Skyline Financial Services': 'https://www.skylinerta.com/ipo.php',
  'Maashitla Securities': 'https://maashitla.com/allotment-status/public-issues',
};
function openRegistrarUnknownModal(ipo, idObj){
  const names = Object.keys(REGISTRAR_FALLBACK_URLS).filter(k=>
    !['KFintech','MUFG Intime','Bigshare'].includes(k) // skip the duplicate/alias entries in the picker list
  );
  openModal(`
    <div class="modal">
      <h3>Which registrar handles ${esc(ipo.name)}?</h3>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 14px;">The live data feed doesn't include registrar info, so this isn't set yet. Pick the correct one — it'll be remembered for this IPO from now on. You can check the IPO's RHP/prospectus or your broker app if you're not sure.</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${names.map(name=>`<button class="btn ghost" data-pick-registrar="${esc(name)}" style="justify-content:flex-start;">${esc(name)}</button>`).join('')}
      </div>
      <div class="modal-actions"><button class="btn ghost" data-close="1" style="flex:1;">Cancel</button></div>
    </div>
  `);
  document.querySelectorAll('[data-pick-registrar]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const name = btn.dataset.pickRegistrar;
    const url = REGISTRAR_FALLBACK_URLS[name];
    ipo.registrar = name;
    await idbPut('ipos', ipo);
    closeModal();
    if(idObj){
      try{ await navigator.clipboard.writeText(idObj.value); toast(`Saved — ${idObj.label} copied, opening ${name}`); }
      catch(e){ toast(`Saved — opening ${name}`); }
    } else {
      toast(`Saved — opening ${name}`);
    }
    window.open(url, '_blank', 'noopener');
    render();
  }));
}
function openGmpHistoryModal(ipo){
  const history = (ipo.gmpHistory || []).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const maxPrice = Number(ipo.maxPrice)||0;
  openModal(`
    <div class="modal" style="max-width:460px;">
      <h3>${esc(ipo.name)} — GMP history</h3>
      ${history.length===0 ? `<div class="empty-state"><div class="t">No history yet</div><div class="s">This builds up day by day as the live feed syncs.</div></div>` : `
      <div style="overflow-x:auto;margin:0 -4px;">
      <table class="gmp-table">
        <thead>
          <tr><th>Date</th><th>GMP</th><th>Est. listing price</th></tr>
        </thead>
        <tbody>
        ${history.map((h, i)=>{
          const prev = history[i+1]; // next in array = previous day, since sorted newest-first
          const pct = h.gmpPercent;
          const gmpAmt = h.gmpPrice!=null ? Number(h.gmpPrice) : null;
          const trendPct = (prev && prev.gmpPercent!=null && pct!=null) ? (Number(pct) - Number(prev.gmpPercent)) : null;
          const trendArrow = trendPct==null ? '' : trendPct>0 ? '▲' : trendPct<0 ? '▼' : '–';
          const trendColor = trendPct==null ? 'var(--ink-faint)' : trendPct>0 ? 'var(--green)' : trendPct<0 ? 'var(--rust)' : 'var(--ink-faint)';
          const pctColor = pct==null ? 'var(--ink-faint)' : Number(pct)>0 ? 'var(--green)' : Number(pct)<0 ? 'var(--rust)' : 'var(--ink)';
          const estListing = (maxPrice>0 && gmpAmt!=null) ? maxPrice+gmpAmt : null;
          return `<tr>
            <td>${fmtDate(h.date)}</td>
            <td class="tabular" style="color:${pctColor};font-weight:650;">
              ${gmpAmt!=null?'₹'+gmpAmt+' ':''}${pct!=null?'('+(Number(pct)>0?'+':'')+pct+'%)':'—'}
              <span style="color:${trendColor};font-size:11px;margin-left:3px;">${trendArrow}</span>
            </td>
            <td class="tabular">${estListing!=null?fmtMoney(estListing):'—'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      </div>
      <p style="font-size:11px;color:var(--ink-faint);margin:10px 2px 0;">Est. listing price = upper price band + GMP. Not a guarantee — actual listing can differ.</p>
      `}
      <div class="modal-actions"><button class="btn ghost" data-close="1" style="flex:1;">Close</button></div>
    </div>
  `);
}
function openAllotmentModal(ipoId){
  const ipo = ipoById(ipoId);
  const nm = (a)=>((applicantById(a.applicantId)||{}).name||'');
  const bn = (a)=>((bankById(a.bankId)||{}).name||'');
  const lotSize = Number(ipo.lotSize)||0;
  const price = ipoPricePerShare(ipo);
  const totalShares = (a)=> lotSize ? (a.lots||0)*lotSize : 0;
  const r2 = (n)=>Math.round(n*100)/100;
  let doneOpen = false;
  let editing = null;                         // { id, mode:'partial' | 'split' }
  const hook = ()=>{ State._onModalClose = ()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); }; };

  const pendingRow = (a)=>{
    const applicant = applicantById(a.applicantId);
    const idObj = allotmentId(applicant);
    return `<div class="al-row" data-swipe="${a.id}">
      <div class="al-main">
        <div class="al-name">${esc(applicant?applicant.name:'—')}${catTag(a)}</div>
        <div class="al-meta tabular">${a.lots?a.lots+' lot'+(a.lots>1?'s':'')+' · ':''}${totalShares(a)?totalShares(a)+' sh · ':''}${fmtMoney(a.amount)}</div>
        <div class="al-links">
          <button class="al-link" data-edit-id="${a.id}" data-edit-mode="partial">Part allotted…</button>
          ${(a.lots||0)>1 ? `<button class="al-link" data-edit-id="${a.id}" data-edit-mode="split">Split</button>` : ''}
        </div>
      </div>
      <button class="btn sm al-check" data-check-allotment="${a.id}" title="Check allotment${idObj?' (copies '+idObj.label+')':' — no PAN or BO ID saved'}">${ICONS.external} Check</button>
      <button class="btn sm ghost" data-set-status="${a.id}" data-status="not_allotted">Not allotted</button>
      <button class="btn sm primary" data-set-status="${a.id}" data-status="allotted">Allotted</button>
    </div>`;
  };
  const doneRow = (a)=>{
    const ok = a.allotmentStatus==='allotted';
    const part = ok && (a.refundedAmount||0)>0;
    const line = !ok ? 'Not allotted · refunded '+fmtMoney(a.refundedAmount||0)
      : part ? `Allotted ${a.allottedShares!=null?a.allottedShares+' sh · ':''}${fmtMoney(a.allottedAmount||0)} · refund ${fmtMoney(a.refundedAmount||0)}`
      : 'Allotted · '+fmtMoney(a.allottedAmount||0);
    return `<div class="al-row">
      <div class="al-main">
        <div class="al-name">${esc(nm(a))}${catTag(a)} <span style="font-weight:500;color:var(--ink-faint);font-size:11.5px;">· ${esc(bn(a))}</span></div>
        <div class="al-meta tabular">${line}</div>
        <div class="al-links"><button class="al-link" data-edit-id="${a.id}" data-edit-mode="partial">Edit shares</button>${(a.lots||0)>1?`<button class="al-link" data-edit-id="${a.id}" data-edit-mode="split">Split by category</button>`:''}</div>
      </div>
      <button class="btn sm ghost" data-set-status="${a.id}" data-status="pending">Undo</button>
    </div>`;
  };

  function editorHtml(a){
    const applicant = applicantById(a.applicantId);
    const head = `<div class="al-name">${esc(applicant?applicant.name:'—')}${catTag(a)}</div>
      <div class="al-meta tabular">Applied ${a.lots} lot${a.lots>1?'s':''}${totalShares(a)?' = '+totalShares(a)+' shares':''} · ${fmtMoney(a.amount)}${price?' · ₹'+price+'/share':''}</div>`;
    if(editing.mode==='split'){
      const L = a.lots||0, catA = a.category||'retail', catB = catA==='shareholder' ? 'retail' : 'shareholder';
      const opts = (sel)=>CATEGORIES.map(([k,l])=>`<option value="${k}" ${k===sel?'selected':''}>${l}</option>`).join('');
      return `<div class="al-edit">${head}
        <div class="set-sub" style="margin:6px 0 8px;">Split these ${L} lots into two applications, one per category, so each result is recorded on its own. Both parts go back to pending.</div>
        <div class="sp-row"><select id="sp-cat-a" class="sel-sm">${opts(catA)}</select><input type="number" id="sp-lots-a" class="num-sm" value="1" min="1" max="${L-1}" inputmode="numeric"><span class="set-sub">lots</span></div>
        <div class="sp-row"><select id="sp-cat-b" class="sel-sm">${opts(catB)}</select><input type="number" id="sp-lots-b" class="num-sm" value="${L-1}" readonly><span class="set-sub">lots</span></div>
        <div class="modal-actions"><button class="btn ghost" id="ae-cancel">Cancel</button><button class="btn primary" id="ae-save">Split</button></div>
      </div>`;
    }
    const total = totalShares(a);
    const cur = a.allottedShares!=null ? a.allottedShares : '';
    return `<div class="al-edit">${head}
      ${price ? '' : `<label class="field" style="margin-top:8px;">Issue price per share (₹)<input type="number" id="ae-price" inputmode="decimal" placeholder="e.g. 150"></label>`}
      <label class="field" style="margin-top:8px;">Shares allotted<input type="number" id="ae-shares" inputmode="numeric" min="0" ${total?`max="${total}"`:''} value="${cur}" placeholder="e.g. 23"></label>
      <div class="chips-row" style="margin:8px 0 2px;">
        ${lotSize ? `<button class="chip" data-ae-fill="${lotSize}">1 lot (${lotSize})</button>` : ''}
        ${total ? `<button class="chip" data-ae-fill="${total}">All (${total})</button>` : ''}
        <button class="chip" data-ae-fill="0">None</button>
      </div>
      <div class="set-sub tabular" id="ae-calc" style="min-height:16px;"></div>
      <div class="modal-actions"><button class="btn ghost" id="ae-cancel">Cancel</button><button class="btn primary" id="ae-save">Save result</button></div>
    </div>`;
  }

  function body(){
    const catRank = (a)=>CATEGORIES.findIndex(c=>c[0]===(a.category||'retail'));
    const apps = ipoApplications(ipoId).slice().sort((x,y)=>bankPos(x.bankId)-bankPos(y.bankId)||applicantPos(x.applicantId)-applicantPos(y.applicantId)||catRank(x)-catRank(y));
    const pend = apps.filter(a=>a.allotmentStatus==='pending');
    const done = apps.filter(a=>a.allotmentStatus!=='pending');
    const byBank = {};
    pend.forEach(a=>{ (byBank[a.bankId]=byBank[a.bankId]||[]).push(a); });
    const refunded = done.reduce((t,a)=>t+(a.refundedAmount||0),0);
    const show = (a,fn)=> (editing && editing.id===a.id) ? editorHtml(a) : fn(a);
    return `
      <div class="row" style="margin-bottom:2px;">
        <h3 style="margin:0;">${esc(ipo.name)}</h3>
        <button class="iconbtn" data-close="1" title="Close">✕</button>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div class="meta" style="font-size:12px;color:var(--ink-faint);">${pend.length} pending${done.length?` · ${done.length} done`:''}${pend.length?' · swipe → allotted, ← not':''}</div>
        ${ipo.registrarUrl ? `<a class="link" href="${esc(ipo.registrarUrl)}" target="_blank" rel="noopener" style="font-size:12px;display:inline-flex;align-items:center;gap:5px;">${ICONS.external} Registrar site</a>` : ''}
      </div>
      ${apps.length===0 ? `<div class="empty-state"><div class="t">No applications for this IPO</div></div>` : ''}
      ${apps.length>0 && pend.length===0 ? `<div class="meta" style="text-align:center;padding:18px 0;color:var(--ink-faint);font-size:13px;">All results marked ✓</div>` : ''}
      ${Object.keys(byBank).sort((x,y)=>bankPos(x)-bankPos(y)).map(bid=>`
        <div class="al-bank">${esc((bankById(bid)||{}).name||'—')}</div>
        ${byBank[bid].map(a=>show(a,pendingRow)).join('')}
      `).join('')}
      ${done.length ? `
        <details class="al-done" ${doneOpen?'open':''}>
          <summary>Done (${done.length})${refunded?` · ${fmtMoney(refunded)} refunded`:''}</summary>
          ${done.map(a=>show(a,doneRow)).join('')}
        </details>` : ''}
    `;
  }

  openModal(`<div class="modal" id="allot-modal" style="max-width:520px;"></div>`);
  history.pushState({ route:State.route, nav: State.route==='applications' ? { ipoId:State.appNav.ipoId, bankId:State.appNav.bankId } : undefined, modal:true }, '', '#'+State.route);
  const el = document.getElementById('allot-modal');

  function snapshot(app){ return { allotmentStatus:app.allotmentStatus, allottedAmount:app.allottedAmount, refundedAmount:app.refundedAmount, refundDate:app.refundDate, allottedShares:app.allottedShares }; }
  function undoToast(app, prev, text){
    toast(text, { ms:5000, action:{ label:'Undo', fn: async ()=>{
      Object.keys(prev).forEach(k=>{ if(prev[k]===undefined) delete app[k]; else app[k]=prev[k]; });
      await idbPut('applications', app); paint(); hook();
    } } });
  }

  function paint(){
    const top = el.scrollTop;                 // keep the user's place in the list
    if(editing){ const ea = State.applications.find(x=>x.id===editing.id); if(ea && ea.allotmentStatus!=='pending') doneOpen = true; }
    el.innerHTML = body();
    el.scrollTop = top;
    const det = el.querySelector('.al-done');
    if(det) det.addEventListener('toggle', ()=>{ doneOpen = det.open; });

    el.querySelectorAll('[data-check-allotment]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const app = State.applications.find(x=>x.id===btn.dataset.checkAllotment);
      const applicant = applicantById(app.applicantId);
      const idObj = allotmentId(applicant);
      const knownUrl = ipo.registrarUrl || REGISTRAR_FALLBACK_URLS[ipo.registrar];
      if(!knownUrl){ openRegistrarUnknownModal(ipo, idObj); return; }
      if(idObj){
        try{ await navigator.clipboard.writeText(idObj.value); toast(`${idObj.label} copied — paste it on the registrar page`); }
        catch(e){ toast(`Opening registrar site — ${idObj.label}: ${idObj.value}`); }
      } else {
        toast('No PAN or BO ID saved for this applicant — add one in Applicants');
      }
      window.open(knownUrl, '_blank', 'noopener');
    }));

    el.querySelectorAll('[data-set-status]').forEach(btn=>btn.addEventListener('click', ()=>applyStatus(btn.dataset.setStatus, btn.dataset.status)));
    el.querySelectorAll('[data-edit-id]').forEach(btn=>btn.addEventListener('click', ()=>{ editing = { id:btn.dataset.editId, mode:btn.dataset.editMode }; paint();
      const f = el.querySelector('#ae-shares, #sp-lots-a'); if(f && f.scrollIntoView){ f.scrollIntoView({block:'center'}); } }));

    if(editing){
      const app = State.applications.find(x=>x.id===editing.id);
      const cancel = document.getElementById('ae-cancel'); if(cancel) cancel.addEventListener('click', ()=>{ editing=null; paint(); });
      if(app && editing.mode==='partial'){
        const sh = document.getElementById('ae-shares'), pr = document.getElementById('ae-price'), calc = document.getElementById('ae-calc');
        const total = totalShares(app);
        const upd = ()=>{
          const n = Number(sh.value), p = price || Number(pr&&pr.value) || 0;
          if(sh.value==='' ){ calc.textContent=''; return; }
          if(isNaN(n) || n<0 || (total && n>total)){ calc.style.color='var(--rust)'; calc.textContent = total ? `Enter 0 to ${total} shares` : 'Enter a valid number'; return; }
          calc.style.color='var(--ink-faint)';
          if(!p){ calc.textContent='Enter the issue price to see amounts'; return; }
          const al = Math.min(r2(n*p), app.amount||0);
          calc.textContent = `₹${al.toLocaleString('en-IN')} allotted · ₹${r2((app.amount||0)-al).toLocaleString('en-IN')} refund`;
        };
        sh.addEventListener('input', upd); if(pr) pr.addEventListener('input', upd);
        el.querySelectorAll('[data-ae-fill]').forEach(b=>b.addEventListener('click', ()=>{ sh.value = b.dataset.aeFill; upd(); }));
        upd();
        document.getElementById('ae-save').addEventListener('click', async ()=>{
          const n = Number(sh.value), p = price || Number(pr&&pr.value) || 0, total2 = totalShares(app);
          if(sh.value==='' || isNaN(n) || n<0 || (total2 && n>total2)){ toast(total2 ? `Enter 0 to ${total2} shares` : 'Enter the shares allotted'); return; }
          if(!p){ toast('Enter the issue price per share'); return; }
          const prev = snapshot(app), amt = app.amount||0, al = Math.min(r2(n*p), amt);
          app.allotmentStatus = n===0 ? 'not_allotted' : 'allotted';
          app.allottedShares = n; app.allottedAmount = al; app.refundedAmount = r2(amt-al);
          app.refundDate = app.refundedAmount>0 ? (app.refundDate || todayStr()) : null;
          await idbPut('applications', app);
          editing = null; paint(); hook();
          undoToast(app, prev, `${nm(app)}: ${n} share${n===1?'':'s'} allotted`);
        });
      }
      if(app && editing.mode==='split'){
        const L = app.lots||0, la = document.getElementById('sp-lots-a'), lb = document.getElementById('sp-lots-b');
        la.addEventListener('input', ()=>{ lb.value = L - (parseInt(la.value)||0); });
        document.getElementById('ae-save').addEventListener('click', async ()=>{
          const x = parseInt(la.value);
          if(!(x>=1 && x<L)){ toast(`Part A must be between 1 and ${L-1} lots`); return; }
          const perLot = (app.amount||0)/L, catA = document.getElementById('sp-cat-a').value, catB = document.getElementById('sp-cat-b').value;
          const second = { ...app, id: uid(), lots: L-x, amount: r2(perLot*(L-x)), category: catB };
          app.lots = x; app.amount = r2(perLot*x); app.category = catA;
          for(const o of [app, second]){ o.allotmentStatus='pending'; o.allottedAmount=0; o.refundedAmount=0; o.refundDate=null; delete o.allottedShares; }
          await idbPut('applications', app); await idbPut('applications', second); State.applications.push(second);
          editing = null; paint(); hook();
          toast(`Split into ${x} + ${L-x} lots — now enter each result`);
        });
      }
    }

    // Swipe a pending row: right = Allotted, left = Not allotted
    el.querySelectorAll('.al-row[data-swipe]').forEach(row=>{
      let x0=0,y0=0,dx=0,active=false,locked=false;
      row.addEventListener('touchstart',(e)=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; active=true; locked=false; row.style.transition='none'; },{passive:true});
      row.addEventListener('touchmove',(e)=>{
        if(!active) return; const t=e.touches[0]; dx=t.clientX-x0; const dy=t.clientY-y0;
        if(!locked){ if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.5) locked=true; else if(Math.abs(dy)>10){ active=false; return; } }
        if(locked){
          row.style.transform=`translateX(${Math.max(-140,Math.min(140,dx))}px)`;
          row.style.background = dx>0 ? 'rgba(80,200,120,.14)' : 'rgba(255,107,74,.14)';
        }
      },{passive:true});
      row.addEventListener('touchend',()=>{
        if(!active) return; active=false;
        row.style.transition='transform .15s ease'; row.style.transform=''; row.style.background='';
        if(locked && Math.abs(dx)>=90) applyStatus(row.dataset.swipe, dx>0 ? 'allotted' : 'not_allotted');
      });
    });
  }

  async function applyStatus(appId, status){
    const app = State.applications.find(x=>x.id===appId);
    if(!app) return;
    const prev = snapshot(app);
    app.allotmentStatus = status;
    if(status==='not_allotted'){
      app.allottedAmount = 0; app.refundedAmount = app.amount||0; app.refundDate = app.refundDate || todayStr(); app.allottedShares = 0;
    } else if(status==='allotted'){
      app.allottedAmount = app.amount||0; app.refundedAmount = 0; app.refundDate = null;
      if(totalShares(app)) app.allottedShares = totalShares(app); else delete app.allottedShares;
    } else {                                  // undo -> back to pending
      app.allottedAmount = 0; app.refundedAmount = 0; app.refundDate = null; delete app.allottedShares;
    }
    await idbPut('applications', app);
    editing = null;
    paint();      // redraw only the modal body: no animation, scroll position kept
    hook();       // refresh the page behind it once, on close
    if(status!=='pending') undoToast(app, prev, `${nm(app)}: ${status==='allotted'?'allotted':'not allotted'}`);
  }
  paint();
}

function openDeleteDataModal(){
  const signed = !!(State.user && fbReady);
  openModal(`
    <div class="modal">
      <h3>Delete all my data</h3>
      <p style="font-size:13px;color:var(--ink-dim);">Permanently deletes every bank, applicant, IPO, application, transfer and sale on this device${signed ? ` <b>and the copy saved in your account</b> — your other devices will be emptied too the next time they sync` : ''}. This can’t be undone. Export a backup first if you might want it.</p>
      ${signed ? `<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:10px 0;"><input type="checkbox" id="del-auth" style="width:18px;height:18px;"> Also remove my Google sign-in record from this app</label>` : ''}
      <label class="field">Type DELETE to confirm<input type="text" id="del-confirm" autocapitalize="characters" autocomplete="off" placeholder="DELETE"></label>
      <div class="modal-actions">
        <button class="btn ghost" data-close="1">Cancel</button>
        <button class="btn danger" id="del-go" disabled>Delete everything</button>
      </div>
    </div>`);
  const input = document.getElementById('del-confirm'), go_ = document.getElementById('del-go');
  input.addEventListener('input', ()=>{ go_.disabled = input.value.trim().toUpperCase()!=='DELETE'; });
  go_.addEventListener('click', async ()=>{
    go_.disabled = true; go_.textContent = 'Deleting…';
    const alsoAuth = signed && document.getElementById('del-auth') && document.getElementById('del-auth').checked;
    // 1) cloud copy first — if this fails we stop, so nothing is half-deleted
    if(signed){
      try{
        for(const st of SYNCABLE_STORES){
          const snap = await fbDb.collection('users').doc(State.user.uid).collection(st).get();
          let batch = fbDb.batch(), n = 0;
          for(const d of snap.docs){ batch.delete(d.ref); if(++n===400){ await batch.commit(); batch = fbDb.batch(); n = 0; } }
          if(n) await batch.commit();
        }
      }catch(e){
        console.error('Cloud delete failed', e);
        toast('Couldn’t delete the cloud copy — nothing was deleted. Check your connection and try again.');
        go_.disabled = false; go_.textContent = 'Delete everything'; return;
      }
    }
    // 2) this device
    for(const s_ of ['banks','applicants','ipos','applications','transfers','sales']) await idbClear(s_);
    try{ Object.keys(localStorage).filter(k=>k.startsWith('ipoledger_')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    State.appNav = { ipoId:null, bankId:null };
    await loadAll();
    // 3) optional: the sign-in record itself, then sign out
    if(alsoAuth && fbAuth.currentUser){
      try{ await fbAuth.currentUser.delete(); }
      catch(e){
        if(e.code==='auth/requires-recent-login'){
          try{ await fbAuth.currentUser.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider()); await fbAuth.currentUser.delete(); }
          catch(e2){ console.warn('Auth record not removed', e2); }
        }
      }
    }
    if(fbReady && fbAuth.currentUser){ try{ await fbAuth.signOut(); }catch(e){} }
    closeModal(); toast('All your data was deleted'); go('dashboard');
  });
}

/* ---------- LOCAL NOTIFICATIONS (free, no backend) ----------
   Real push notifications that fire even with the app fully closed require
   a paid backend (Firebase Cloud Functions needs the Blaze plan). This is
   the honest free alternative: a browser Notification fires the moment the
   app is opened (or brought back to the foreground) on any day something is
   due — closing-today IPOs with their GMP, and "check allotment" on
   allotment day. It won't wake your phone at a fixed time on its own; it
   fires as soon as you next open the app that day, once per item per day. */
function todaysNotifiableItems(){
  const items = [];
  State.ipos.forEach(ipo=>{
    const closeD = daysDiff(ipo.closeDate);
    const allotD = daysDiff(ipo.allotmentDate);
    if(closeD===0){
      const gmpTag = ipo.gmpPercent!=null ? ` (GMP ${Number(ipo.gmpPercent)>0?'+':''}${ipo.gmpPercent}%)` : '';
      items.push({ key:`close:${ipo.id}:${todayStr()}`, title:`${ipo.name} closes today${gmpTag}`, body:'Last day to apply.' });
    }
    if(allotD===0){
      items.push({ key:`allot:${ipo.id}:${todayStr()}`, title:`${ipo.name} — allotment day`, body:'Check allotment if available.' });
    }
  });
  return items;
}
function checkAndFireLocalNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const firedKey = 'ipo-notified-keys';
  let fired;
  try{ fired = new Set(JSON.parse(localStorage.getItem(firedKey)||'[]')); }
  catch(e){ fired = new Set(); }
  const items = todaysNotifiableItems();
  let firedAny = false;
  for(const item of items){
    if(fired.has(item.key)) continue;
    try{ new Notification(item.title, { body:item.body, icon: undefined, tag:item.key }); }
    catch(e){ console.error('Notification failed', e); }
    fired.add(item.key);
    firedAny = true;
  }
  if(firedAny){
    // Trim to roughly the last week's worth of keys so this never grows unbounded.
    const trimmed = Array.from(fired).slice(-200);
    localStorage.setItem(firedKey, JSON.stringify(trimmed));
  }
}
async function registerPeriodicSync(){
  // Best-effort — only works on Android Chrome, installed as a home-screen
  // app, and only after the browser judges the site "engaged with" enough.
  // Any failure here is silent and non-fatal; the in-app check on open still
  // covers every platform as the baseline.
  try{
    const reg = window._swRegistration || await navigator.serviceWorker.ready;
    if(!reg || !('periodicSync' in reg)) return false;
    const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
    if(status.state !== 'granted') return false;
    await reg.periodicSync.register('ipo-daily-check', { minInterval: 12 * 60 * 60 * 1000 }); // 12h — a floor, not a guarantee
    return true;
  }catch(e){ return false; }
}
async function enableNotifications(){
  if(!('Notification' in window)){ toast('Notifications are not supported in this browser'); return; }
  if(Notification.permission==='granted'){
    toast('Notifications are already enabled');
    checkAndFireLocalNotifications();
    await registerPeriodicSync();
    return;
  }
  if(Notification.permission==='denied'){ toast('Notifications are blocked — enable them in your browser/app settings for this site'); return; }
  const result = await Notification.requestPermission();
  if(result==='granted'){
    toast('Notifications enabled');
    checkAndFireLocalNotifications();
    const bgOk = await registerPeriodicSync();
    if(!bgOk){
      // Not fatal — just means this device/browser can't do true background
      // checks; the open-the-app check still works everywhere.
      console.log('Periodic background sync unavailable on this device/browser — in-app check still active.');
    }
  } else {
    toast('Notifications not enabled');
  }
  render(); // refresh Settings so the button reflects the new state
}

/* ---------- THEME ---------- */
function applyTheme(){
  const t = localStorage.getItem('ipo-theme');
  if(t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- INSTALL (PWA "Add to Home Screen") ---------- */
let deferredInstallPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(State.route==='settings') render(); // refresh so the Install button becomes active
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; toast('App installed'); });

/* ---------- BOOT ---------- */
(async function boot(){
  applyTheme();
  try{
    db = await openDB();
    await loadAll();
  }catch(e){
    console.error('DB init failed', e);
  }
  initFirebase();
  setupAuthListener(); // if a session already exists, this pulls cloud data and re-renders
  if(fbReady){
    try{ await fbAuth.getRedirectResult(); } // completes a signInWithRedirect flow, if one was in progress
    catch(e){ console.error('Redirect sign-in failed', e); toast('Sign-in failed'); }
  }
  // Restore whichever tab the URL hash points to (e.g. after a refresh),
  // falling back to dashboard. Use replaceState (not pushState) here so this
  // initial load doesn't itself become a Back-button stop.
  const initialRoute = (location.hash||'').replace('#','');
  State.route = VALID_ROUTES.includes(initialRoute) ? initialRoute : 'dashboard';
  go(State.route, {replace:true});
  checkAndFireLocalNotifications();
  autoSyncIfNeeded();
})();
// Auto-syncs the live IPO feed once per calendar day, the first time the app
// is opened that day — no manual "Sync live IPOs" tap needed. Runs quietly
// in the background; the same toast syncLiveIpos() already shows is the
// only visible sign it happened. If it fails (offline, feed down), it just
// tries again next time the app opens — no error shown, since a background
// sync failing silently is better than interrupting whatever the user
// actually opened the app to do.
function autoSyncIfNeeded(){
  try{
    const lastSync = localStorage.getItem('ipo-feed-last-sync');
    const lastSyncDate = lastSync ? new Date(lastSync).toDateString() : null;
    const today = new Date().toDateString();
    if(lastSyncDate !== today){
      syncLiveIpos(true).catch(()=>{ /* silent — will retry next app open */ });
    }
  }catch(e){ /* localStorage unavailable or similar — skip silently */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') checkAndFireLocalNotifications();
});
</script>
