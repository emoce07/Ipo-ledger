<style>
:root{
  --bg:#12161c; --bg-alt:#0d1015;
  --card:#1b2129; --card-hi:#212934;
  --line:#2a323d;
  --ink:#edeae3; --ink-dim:#a3aab5; --ink-faint:#6b7280;
  --gold:#c9a24b; --gold-dim:#8a7038;
  --green:#3f8f6f; --green-bg:#1a2b24;
  --rust:#b5524a; --rust-bg:#2b1c1b;
  --blue:#4b7fb5; --blue-bg:#1b2530;
  --radius:10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f3ee; --bg-alt:#ffffff;
    --card:#ffffff; --card-hi:#faf8f3;
    --line:#e2ddd0;
    --ink:#1c1b18; --ink-dim:#5c574c; --ink-faint:#948d7c;
    --gold:#a3792f; --gold-dim:#c9a24b;
    --green:#2f7a5a; --green-bg:#e3efe9;
    --rust:#a1443c; --rust-bg:#f5e5e3;
    --blue:#3a6693; --blue-bg:#e5edf5;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --bg-alt:#0d1015; --card:#1b2129; --card-hi:#212934; --line:#2a323d;
  --ink:#edeae3; --ink-dim:#a3aab5; --ink-faint:#6b7280;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
*{ box-sizing:border-box; }
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  height:100%; -webkit-font-smoothing:antialiased;
}
.tabular{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
button{ font-family:inherit; }
input, select{ font-family:inherit; }

/* ---------- shell ---------- */
#app{ display:flex; min-height:100%; }
.rail{
  width:220px; flex-shrink:0; background:var(--bg-alt); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 12px;
  position:sticky; top:0; height:100vh; height:100dvh;
}
.brand{ display:flex; align-items:center; gap:10px; padding:8px 10px 22px; }
.brand .mark{ width:26px; height:26px; border-radius:6px; background:linear-gradient(135deg,var(--gold),var(--gold-dim)); flex-shrink:0; }
.brand .name{ font-size:15px; font-weight:600; letter-spacing:.2px; }
.brand .sub{ font-size:11px; color:var(--ink-faint); }
nav.navlist{ display:flex; flex-direction:column; gap:2px; }
nav.navlist button{
  display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
  color:var(--ink-dim); padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.5px;
}
nav.navlist button svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
nav.navlist button:hover{ background:var(--card); color:var(--ink); }
nav.navlist button.active{ background:var(--card-hi); color:var(--ink); box-shadow:inset 2px 0 0 var(--gold); }
.rail-foot{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }
.rail-foot button{ background:none; border:1px solid var(--line); color:var(--ink-dim); font-size:12px; padding:8px; border-radius:8px; cursor:pointer; }
.rail-foot button:hover{ color:var(--ink); border-color:var(--ink-faint); }

main{ flex:1; min-width:0; padding:26px 30px 90px; max-width:900px; }
.page-title{ font-size:20px; font-weight:600; margin:0 0 4px; }
.page-sub{ font-size:13px; color:var(--ink-faint); margin:0 0 22px; }

/* bottom tab bar (mobile) */
.tabbar{ display:none; }

@media (max-width: 760px){
  .rail{ display:none; }
  #app{ flex-direction:column; }
  main{ padding:16px 14px 90px; max-width:100%; }
  .tabbar{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg-alt); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    justify-content:space-around;
  }
  .tabbar button{ background:none;border:none;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px 6px;cursor:pointer; }
  .tabbar button svg{ width:19px;height:19px; }
  .tabbar button.active{ color:var(--gold); }
}

/* ---------- primitives ---------- */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.grid{ display:grid; gap:12px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:640px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr 1fr; } }

.stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
.stat .label{ font-size:11.5px; color:var(--ink-faint); margin-bottom:6px; }
.stat .value{ font-size:22px; font-weight:650; }
.stat .value.pos{ color:var(--green); }
.stat .value.neg{ color:var(--rust); }
.stat .value.gold{ color:var(--gold); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; background:var(--card-hi); color:var(--ink); border:1px solid var(--line); }
.btn:hover{ border-color:var(--ink-faint); }
.btn.primary{ background:var(--gold); color:#1b1404; border-color:var(--gold); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.primary:disabled{ background:var(--line); color:var(--ink-faint); cursor:not-allowed; border-color:var(--line); }
.btn.danger{ color:var(--rust); border-color:var(--rust); background:none; }
.btn.ghost{ background:none; border-color:var(--line); }
.btn.block{ width:100%; padding:14px; font-size:14.5px; }
.btn.sm{ padding:6px 10px; font-size:12px; }

input[type=text], input[type=number], input[type=date], select, textarea{

<script>
/* =========================================================
   IPO LEDGER — single-file app
   Storage: IndexedDB (offline persistent)
   ========================================================= */

/* ---------- ICONS (tiny inline svg set) ---------- */
const ICONS = {

  people: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-4 3-6 6.5-6s5.9 2 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 13.2c2.6.3 4.3 2 4.8 4.8"/></svg>`,

  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 000 3l.1.1a2 2 0 01-2.6 2.6l-.1-.1a1.7 1.7 0 00-3 0v.1a2 2 0 01-4 0v-.2a1.7 1.7 0 00-3-.1l-.1.1a2 2 0 01-2.6-2.6l.1-.1a1.7 1.7 0 000-3H4a2 2 0 010-4h.1a1.7 1.7 0 001-3.1l-.1-.1a2 2 0 012.6-2.6l.1.1a1.7 1.7 0 003 0V4a2 2 0 014 0v.1a1.7 1.7 0 003 1.1l.1-.1a2 2 0 012.6 2.6l-.1.1a1.7 1.7 0 00-1 3.1v.1a1.7 1.7 0 001.6 1z"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`,

  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg>`,
  external: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M9 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-3"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 4h16"/></svg>`,
};

/* ---------- PWA: manifest + service worker (installable / add to home screen) ---------- */
(function setupPWA(){
  try{
    const ICON192 = document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
    const ICON512 = document.querySelector('link[sizes="512x512"]').getAttribute('href');
    const manifest = {
      name: "IPO Ledger",
      short_name: "IPO Ledger",
      description: "Money & IPO application tracker",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#12161c",
      theme_color: "#12161c",
      icons: [
        { src: ICON192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: ICON512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const manifestUrl = URL.createObjectURL(blob);
    document.getElementById('pwa-manifest-link').setAttribute('href', manifestUrl);
  }catch(e){ console.warn('PWA manifest setup failed', e); }

  // Minimal offline-friendly service worker, registered from an in-memory blob.
  // Some browsers restrict blob: service workers; failures here are non-fatal —
  // the app still works fully, it just may not qualify for the full "Install" banner everywhere.
  if('serviceWorker' in navigator){
    try{
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          e.respondWith(fetch(e.request).catch(()=> caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], {type:'text/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{ /* silently ignore unsupported blob SW */ });
    }catch(e){ /* ignore */ }
  }
})();

/* ---------- DB LAYER (IndexedDB) ---------- */
const DB_NAME = 'ipo_ledger_db';
const DB_VERSION = 1;
const STORES = ['banks','applicants','ipos','applications','transfers','sales','meta'];
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('banks')) d.createObjectStore('banks',{keyPath:'id'});
      if(!d.objectStoreNames.contains('applicants')) d.createObjectStore('applicants',{keyPath:'id'});
      if(!d.objectStoreNames.contains('ipos')) d.createObjectStore('ipos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('applications')) d.createObjectStore('applications',{keyPath:'id'});
      if(!d.objectStoreNames.contains('transfers')) d.createObjectStore('transfers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = (e)=>{ resolve(e.target.result); };
    req.onerror = (e)=>{ reject(e); };
  });
}

function txStore(name, mode='readonly'){
  const tx = db.transaction(name, mode);
  return tx.objectStore(name);
}
function idbAll(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store).getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = reject;
  });
}
function idbPut(store, obj){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').put(obj);
    req.onsuccess = ()=>resolve(obj);
    req.onerror = reject;
  });
}
function idbDelete(store, id){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').delete(id);
    req.onsuccess = ()=>resolve();
    req.onerror = reject;
  });
}
function idbClear(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,'readwrite').clear();
    req.onsuccess = ()=>resolve();
    req.onerror = reject;
  });
}

/* ---------- STATE ---------- */
const State = {
  banks: [], applicants: [], ipos: [], applications: [], transfers: [], sales: [],
  route: 'dashboard',
  applyFlow: { ipoId: null, bankId: null, selected: new Map() }, // applicantId -> lot count
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMoney(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  const s = n.toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-':'')+'₹'+s;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}
function daysDiff(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayStr()+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Pull every number out of a price band string like "₹123–₹130" or "Rs. 32 - 34"
// (handles –, —, - as separators and stray commas) and returns the highest one.
function parseMaxPriceFromBand(band){
  if(!band) return 0;
  const nums = String(band).replace(/,/g,'').match(/\d+(\.\d+)?/g);
  if(!nums || nums.length===0) return 0;
  return Math.max(...nums.map(Number));
}

async function loadAll(){
  [State.banks, State.applicants, State.ipos, State.applications, State.transfers, State.sales] =
    await Promise.all([idbAll('banks'), idbAll('applicants'), idbAll('ipos'), idbAll('applications'), idbAll('transfers'), idbAll('sales')]);
}

/* ---------- DERIVED / COMPUTED ---------- */
function bankById(id){ return State.banks.find(b=>b.id===id); }
function applicantById(id){ return State.applicants.find(a=>a.id===id); }
function ipoById(id){ return State.ipos.find(i=>i.id===id); }

// Money movements affecting a bank: entered balance + transfers + applications (blocked) + refunds
function bankLedger(bankId){
  const bank = bankById(bankId);
  if(!bank) return { entries:[], current:0 };
  const entries = [];
  entries.push({ date: bank.createdDate||todayStr(), label:'Opening balance', amount: bank.openingBalance||0, running:0 });

  // transfers out/in
  State.transfers.forEach(t=>{
    if(t.fromBankId===bankId) entries.push({date:t.date, label:`Transfer to ${bankById(t.toBankId)?.name||'—'}`, amount:-t.amount});
    if(t.toBankId===bankId) entries.push({date:t.date, label:`Transfer from ${bankById(t.fromBankId)?.name||'—'}`, amount:t.amount});
  });

  // applications: blocked amount leaves bank when applied; refund/unblock returns money
  State.applications.filter(a=>a.bankId===bankId).forEach(a=>{
    const ipo = ipoById(a.ipoId);
    entries.push({ date:a.appliedDate, label:`${ipo?ipo.name:'IPO'} — applied (${applicantById(a.applicantId)?.name||'—'})`, amount:-(a.amount||0) });
    const refunded = a.refundedAmount||0;
    if(refunded>0){
      entries.push({ date:a.refundDate||a.appliedDate, label:`${ipo?ipo.name:'IPO'} — refund/unblock (${applicantById(a.applicantId)?.name||'—'})`, amount:refunded });
    }
  });

  entries.sort((x,y)=> (x.date||'').localeCompare(y.date||''));
  let running = 0;
  entries.forEach(e=>{ running += e.amount; e.running = running; });
  return { entries, current: running };
}

function bankAvailable(bankId){
  return bankLedger(bankId).current;
}
function bankBlocked(bankId){
  // sum of applications on this bank not yet refunded (pending amount)
  return State.applications.filter(a=>a.bankId===bankId).reduce((sum,a)=>{
    const applied = a.amount||0;
    const refunded = a.refundedAmount||0;
    return sum + Math.max(0, applied - refunded);
  },0);
}

function ipoStatus(ipo){
  const openD = daysDiff(ipo.openDate);
  const closeD = daysDiff(ipo.closeDate);
  const allotD = daysDiff(ipo.allotmentDate);
  const listD = daysDiff(ipo.listingDate);
  if(listD!==null && listD<=0) return {key:'listed', label: listD===0?'Listing today':'Listed'};
  if(listD===1) return {key:'listed', label:'Listing tomorrow'};
  if(allotD!==null && allotD<=0) return {key:'allot', label: allotD===0?'Allotment today':'Allotment out'};
  if(allotD===1) return {key:'allot', label:'Allotment tomorrow'};
  if(closeD!==null && closeD<0) return {key:'closed', label:'Closed'};
  if(closeD===0) return {key:'closing', label:'Closing today'};
  if(closeD===1) return {key:'closing', label:'Closing tomorrow'};
  if(openD!==null && openD<=0 && (closeD===null||closeD>=0)) return {key:'open', label:'Open now'};
  if(openD===1) return {key:'upcoming', label:'Opens tomorrow'};
  if(openD!==null && openD>1) return {key:'upcoming', label:`Opens in ${openD}d`};
  return {key:'closed', label:'—'};
}

function ipoApplications(ipoId){ return State.applications.filter(a=>a.ipoId===ipoId); }
function ipoLotAmount(ipo){
  if(!ipo) return 0;
  // Block price = (shares per lot) × (max price in the price band).
  // Prefer the explicit maxPrice field, but fall back to parsing the price
  // band text so an out-of-sync/blank maxPrice never silently zeroes this out.
  const maxPrice = Number(ipo.maxPrice) || parseMaxPriceFromBand(ipo.priceBand) || 0;
  const lot = Number(ipo.lotSize)||0;
  return maxPrice*lot;
}
function ipoTotalApplied(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.amount||0),0); }
function ipoTotalAllotted(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.allottedAmount||0),0); }
function ipoTotalRefunded(ipoId){ return ipoApplications(ipoId).reduce((s,a)=>s+(a.refundedAmount||0),0); }
function ipoTotalPending(ipoId){
  return ipoApplications(ipoId).reduce((s,a)=>{
    const applied=a.amount||0, allotted=a.allottedAmount||0, refunded=a.refundedAmount||0;
    // pending = applied - allotted - refunded (money not yet resolved), floor 0
    if(a.allotmentStatus==='pending') return s + Math.max(0, applied - refunded);
    return s;
  },0);
}

function totalBlockedAll(){
  return State.banks.reduce((s,b)=>s+bankBlocked(b.id),0);
}
function totalRefundPendingAll(){
  return State.applications.reduce((s,a)=>{
    if(a.allotmentStatus==='pending') return s;
    const applied=a.amount||0, allotted=a.allottedAmount||0, refunded=a.refundedAmount||0;
    const owed = applied - allotted; // amount that should eventually be refunded
    const stillPending = owed - refunded;
    return s + Math.max(0, stillPending);
  },0);
}
function totalProfitAll(){
  return State.sales.reduce((s,sale)=> s + ((sale.saleAmount||0) - (sale.investment||0) - (sale.charges||0)), 0);
}
function totalMoneyInBanks(){
  return State.banks.reduce((s,b)=>s+bankAvailable(b.id),0) + totalBlockedAll();
  // "total money in tracked banks" = available + blocked (i.e. total capital across banks)
}
function activeApplicationsCount(){
  return State.applications.filter(a=>{
    const ipo = ipoById(a.ipoId);
    if(!ipo) return false;
    const st = ipoStatus(ipo).key;
    return st!=='listed';
  }).length;
}
function upcomingIposCount(){
  return State.ipos.filter(i=> ipoStatus(i).key==='upcoming').length;
}

/* fuzzy-ish partial match: all chars of query appear in order, or substring match on name/company */
function ipoMatches(ipo, q){
  q = q.trim().toLowerCase();
  if(!q) return true;
  const hay = (ipo.name+' '+(ipo.company||'')).toLowerCase();
  if(hay.includes(q)) return true;
  // subsequence fuzzy match
  let qi=0;
  for(let i=0;i<hay.length && qi<q.length;i++){ if(hay[i]===q[qi]) qi++; }
  return qi===q.length;
}

/* ---------- BACKUP ---------- */
function exportBackup(){
  const data = {
    version:1, exportedAt:new Date().toISOString(),
    banks:State.banks, applicants:State.applicants, ipos:State.ipos,
    applications:State.applications, transfers:State.transfers, sales:State.sales,
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ipo-ledger-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exported');
}
function triggerImport(){
  const input = document.createElement('input');
  input.type='file'; input.accept='application/json';
  input.addEventListener('change', async ()=>{
    const file = input.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      openModal(`
        <div class="modal">
          <h3>Import backup?</h3>
          <p style="font-size:13px;color:var(--ink-dim);margin:0 0 6px;">This will replace ALL current data with the contents of this file. This cannot be undone.</p>
          <p style="font-size:12px;color:var(--ink-faint);">${(data.banks||[]).length} banks, ${(data.applicants||[]).length} applicants, ${(data.ipos||[]).length} IPOs, ${(data.applications||[]).length} applications.</p>
          <div class="modal-actions">
            <button class="btn ghost" data-close="1">Cancel</button>
            <button class="btn primary" id="confirm-import">Replace all data</button>
          </div>
        </div>`);
      document.getElementById('confirm-import').addEventListener('click', async ()=>{
        for(const s of ['banks','applicants','ipos','applications','transfers','sales']) await idbClear(s);
        for(const s of ['banks','applicants','ipos','applications','transfers','sales']){
          for(const item of (data[s]||[])) await idbPut(s, item);
        }
        await loadAll();
        closeModal(); toast('Backup imported'); render();
      });
    }catch(err){ toast('Invalid backup file'); }
  });
  input.click();
}

        <div style="font-size:13px;color:var(--ink-dim);">${count} applicant${count>1?'s':''} · ${totalLots} lot${totalLots>1?'s':''} total</div>
        <div style="font-size:14px;font-weight:650;" class="tabular">${totalLots} × ${fmtMoney(lotAmt)} = ${fmtMoney(estTotal)}</div>
      </div>
      <button class="btn primary block" id="mark-applied-btn" style="margin-top:12px;">
        Mark selected as applied
      </button>
      ${estTotal>avail? `<div style="font-size:12px;color:var(--rust);margin-top:8px;">Amount exceeds available balance in ${esc(bank.name)} (${fmtMoney(avail)} available). You can still proceed if this is expected.</div>`:''}
    ` : '';
    const markBtn = document.getElementById('mark-applied-btn');
    if(markBtn) markBtn.addEventListener('click', ()=> markSelectedApplied(ipo, bank, lotAmt));
  }

  if(ipo) renderApplyDetails();
}

async function markSelectedApplied(ipo, bank, lotAmt){
  const flow = State.applyFlow;
  const entries = Array.from(flow.selected.entries()); // [applicantId, lots]
  let totalAmount = 0;
  for(const [applicantId, lots] of entries){
    const amount = lots*lotAmt;
    totalAmount += amount;
    const app = {
      id: uid(), ipoId: ipo.id, applicantId, bankId: bank.id,
      lots, amount, appliedDate: todayStr(),
      allotmentStatus: 'pending', // pending | not_allotted | allotted
      allottedAmount: 0, refundedAmount: 0, refundDate: null,
    };
    await idbPut('applications', app);
    State.applications.push(app);
  }
  flow.selected = new Map();
  toast(`✅ ${entries.length} application${entries.length>1?'s':''} marked as applied — ${bank.name}, ${fmtMoney(totalAmount)}`);
  render();
  // restore flow state after full re-render
  State.applyFlow.ipoId = ipo.id; State.applyFlow.bankId = bank.id;
  go('apply');
}

/* ==================== IPOs ==================== */
const IPO_FEED_URL = 'https://raw.githubusercontent.com/emoce07/ipo-data/refs/heads/main/ipos.json';

function isoToDate(s){
  // accepts "YYYY-MM-DD" already, or falls through
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if(isNaN(d)) return '';
  return d.toISOString().slice(0,10);
}

async function syncLiveIpos(){
  const btn = document.getElementById('sync-ipos-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Syncing…'; }
  try{
    const res = await fetch(IPO_FEED_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('Fetch failed: '+res.status);
    const data = await res.json();
    const feed = Array.isArray(data.ipos) ? data.ipos : [];
    let added=0, updated=0;
    for(const item of feed){
      if(!item.name) continue;
      const existing = State.ipos.find(i=>i.name.trim().toLowerCase()===item.name.trim().toLowerCase());
      const obj = existing || { id: uid() };
      obj.name = item.name;
      obj.company = item.company || obj.company || '';
      obj.openDate = isoToDate(item.openDate) || obj.openDate || '';
      obj.closeDate = isoToDate(item.closeDate) || obj.closeDate || '';
      obj.allotmentDate = isoToDate(item.allotmentDate) || obj.allotmentDate || '';
      obj.refundDate = isoToDate(item.refundDate) || obj.refundDate || '';
      obj.listingDate = isoToDate(item.listingDate) || obj.listingDate || '';
      obj.priceBand = item.priceBand || obj.priceBand || '';
      // maxPrice: trust an explicit non-zero value from the feed first;
      // otherwise derive it straight from the (just-updated) price band text,
      // so the block price recalculates every sync instead of staying stuck
      // at whatever it was the first time this IPO was added.
      obj.maxPrice = Number(item.maxPrice) || parseMaxPriceFromBand(obj.priceBand) || obj.maxPrice || 0;
      obj.lotSize = Number(item.lotSize)||obj.lotSize||0;
      obj.registrar = item.registrar || obj.registrar || '';
      obj.registrarUrl = item.registrarUrl || obj.registrarUrl || '';
      obj.notes = item.notes || obj.notes || '';
      obj.gmpPercent = (item.gmpPercent!=null && item.gmpPercent!=='') ? Number(item.gmpPercent) : (obj.gmpPercent ?? null);
      obj.gmpPrice = (item.gmpPrice!=null && item.gmpPrice!=='') ? Number(item.gmpPrice) : (obj.gmpPrice ?? null);
      obj.dataComplete = item.dataComplete!==false; // feed flags IPOs it couldn't fully fetch
      // IPO type: trust an explicit feed value; otherwise infer from the name
      // (InvestorGain typically labels SME issues directly in the name), and
      // never downgrade a type the user has already set manually.
      if(item.ipoType==='sme' || item.ipoType==='mainboard') obj.ipoType = item.ipoType;
      else if(!obj.ipoType) obj.ipoType = /\bsme\b/i.test(item.name) ? 'sme' : 'mainboard';
      obj.minLots = Number(item.minLots) || obj.minLots || 1;
      await idbPut('ipos', obj);
      if(existing) updated++; else { State.ipos.push(obj); added++; }
    }
    localStorage.setItem('ipo-feed-last-sync', new Date().toISOString());
    localStorage.setItem('ipo-feed-updated-at', data.updatedAt||'');
    toast(`Synced: ${added} added, ${updated} updated`);
    render();
  }catch(err){
    console.error(err);
    toast('Sync failed — check the feed URL or your connection');
    if(btn){ btn.disabled=false; btn.textContent = 'Sync live IPOs'; }
  }
}

  main._ipoTypeTab = main._ipoTypeTab || 'mainboard';
  const tab = main._ipoTab;
  const typeTab = main._ipoTypeTab;
  const lastSync = localStorage.getItem('ipo-feed-last-sync');
  const feedUpdatedAt = localStorage.getItem('ipo-feed-updated-at');
  const smeCount = State.ipos.filter(i=>i.ipoType==='sme').length;
  const mainboardCount = State.ipos.length - smeCount;
  const incompleteCount = State.ipos.filter(i=>i.dataComplete===false).length;
  main.innerHTML = `
    <div class="row"><h1 class="page-title">IPOs</h1>

  document.getElementById('add-ipo').addEventListener('click',()=>openIpoModal(null));

  main.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ main._ipoTab=b.dataset.tab; renderIpos(main); }));
  main.querySelectorAll('[data-type-tab]').forEach(b=>b.addEventListener('click',()=>{ main._ipoTypeTab=b.dataset.typeTab; renderIpos(main); }));
  let list = State.ipos.filter(i=> (i.ipoType||'mainboard')===typeTab );

async function autoDetectSmeIpos(){
  const SME_THRESHOLD = 90000; // amount-per-lot above this is almost always SME, not mainboard
  // Re-check every IPO currently marked mainboard (including the sync's own
  // weaker name-based guess), not just ones with no type at all — the amount
  // check here is more reliable than the sync's "SME in the name" heuristic.
  const checkable = State.ipos.filter(i=> (i.ipoType||'mainboard')==='mainboard');
  const candidates = checkable.filter(i=> ipoLotAmount(i) >= SME_THRESHOLD);
  const skippedNoAmount = checkable.filter(i=> ipoLotAmount(i)===0);

  if(candidates.length===0){
    toast(skippedNoAmount.length>0
      ? `No clear SME matches — ${skippedNoAmount.length} IPO(s) have no price/lot size set yet, so they can't be checked`
      : 'No untagged SME IPOs found — nothing to change');
    return;
  }
  openModal(`
    <div class="modal">
      <h3>Tag ${candidates.length} IPO${candidates.length>1?'s':''} as SME?</h3>
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 10px;">These have an amount per lot of ₹${(SME_THRESHOLD).toLocaleString('en-IN')}+, which is the SME norm (mainboard lots are usually ~₹15,000). Untick any that are wrong:</p>
      <div class="card" style="padding:4px 12px;max-height:220px;overflow-y:auto;">
        ${candidates.map(i=>`
          <label class="check" style="padding:8px 4px;">
            <input type="checkbox" class="sme-fix-check" data-sme-id="${i.id}" checked style="width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;">
            <span class="name">${esc(i.name)}</span>
            <span class="tag tabular">${fmtMoney(ipoLotAmount(i))}</span>
          </label>
        `).join('')}
      </div>
      ${skippedNoAmount.length>0?`<p style="font-size:12px;color:var(--ink-faint);margin-top:10px;">${skippedNoAmount.length} other untagged IPO(s) have no price/lot size entered, so couldn't be checked — tag those manually once you fill in their details.</p>`:''}
      <p style="font-size:12px;color:var(--ink-faint);margin-top:6px;">This is a heuristic based on amount, not certain.</p>
      <div class="modal-actions">
        <button class="btn ghost" data-close="1">Cancel</button>
        <button class="btn primary" id="confirm-sme-fix">Tag selected as SME</button>
      </div>
    </div>
  `);
  document.getElementById('confirm-sme-fix').addEventListener('click', async ()=>{
    const checked = Array.from(document.querySelectorAll('.sme-fix-check:checked')).map(el=>el.dataset.smeId);
    const toTag = candidates.filter(i=>checked.includes(i.id));
    for(const ipo of toTag){
      ipo.ipoType = 'sme';
      if(!ipo.minLots || ipo.minLots<2) ipo.minLots = 2; // sensible SME default, editable after
      await idbPut('ipos', ipo);
    }
    closeModal();
    toast(toTag.length>0 ? `Tagged ${toTag.length} IPO${toTag.length>1?'s':''} as SME` : 'No changes made');
    render();
  });
}

          const applicant = applicantById(a.applicantId); const bank = bankById(a.bankId);
          const pan = applicant?.pan;
          return `<div class="card" data-app-row="${a.id}">
            <div class="row"><div style="font-weight:600;font-size:13.5px;">${esc(applicant?applicant.name:'—')}</div><div class="meta">${esc(bank?bank.name:'—')}</div></div>
            <div class="meta tabular" style="margin:4px 0 10px;">Applied ${a.lots?a.lots+' lot'+(a.lots>1?'s':'')+' · ':''}${fmtMoney(a.amount)}</div>
            ${a.allotmentStatus==='pending' ? `
              <button class="btn sm ghost" data-check-allotment="${a.id}" style="margin-bottom:8px;">
                ${ICONS.external} Check allotment${pan?' (copies PAN)':''}
              </button>
            ` : ''}
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn sm ${a.allotmentStatus==='not_allotted'?'primary':'ghost'}" data-set-status="${a.id}" data-status="not_allotted">Not allotted</button>
              <button class="btn sm ${a.allotmentStatus==='allotted'?'primary':'ghost'}" data-set-status="${a.id}" data-status="allotted">Allotted</button>
            </div>
            ${a.allotmentStatus!=='pending' ? `<div class="meta tabular" style="margin-top:8px;">${a.allotmentStatus==='not_allotted'?`Refunded (unblocked): <b>${fmtMoney(a.refundedAmount||0)}</b>`:`Allotted amount: <b>${fmtMoney(a.allottedAmount||0)}</b> · nothing to refund`}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`}
      <div class="modal-actions"><button class="btn ghost" data-close="1" style="flex:1;">Close</button></div>
    </div>
  `);
  document.querySelectorAll('[data-check-allotment]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const appId = btn.dataset.checkAllotment;
    const app = State.applications.find(x=>x.id===appId);
    const applicant = applicantById(app.applicantId);
    const pan = applicant?.pan;
    const url = ipo.registrarUrl || REGISTRAR_FALLBACK_URLS[ipo.registrar] || REGISTRAR_FALLBACK_URLS.default;
    if(pan){
      try{ await navigator.clipboard.writeText(pan); toast(`PAN copied — paste it on the registrar page`); }
      catch(e){ toast(`Opening registrar site — PAN: ${pan}`); }
    } else {
      toast('No PAN saved for this applicant — add one in Applicants for faster checks');
    }
    window.open(url, '_blank', 'noopener');
  }));
  document.querySelectorAll('[data-set-status]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const appId = btn.dataset.setStatus; const status = btn.dataset.status;
    const app = State.applications.find(x=>x.id===appId);
    app.allotmentStatus = status;
    if(status==='not_allotted'){
      // Not allotted: the full applied amount is unblocked/refunded automatically.
      app.allottedAmount = 0;
      app.refundedAmount = app.amount||0;
      app.refundDate = app.refundDate || todayStr();
    }
    if(status==='allotted'){
      // Allotted: the applied amount converted to shares — nothing left to refund.
      app.allottedAmount = app.amount||0;
      app.refundedAmount = 0;
      app.refundDate = null;
    }
    await idbPut('applications', app);
    openAllotmentModal(ipoId); // re-render modal
    render();
  }));
}

/* ==================== SETTINGS ==================== */
function renderSettings(main){
  const installed = isStandalone();
  const canPrompt = !!deferredInstallPrompt;
  const ios = isIOS();
  main.innerHTML = `
    <h1 class="page-title">Settings</h1>
    <p class="page-sub">Manage your data and appearance</p>

    <div class="section-label">Install as an app</div>
    <div class="card">
      ${installed ? `
        <p style="font-size:13px;color:var(--green);margin:0;">✅ Already running as an installed app.</p>
      ` : canPrompt ? `
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px;">Install IPO Ledger to your home screen — it opens full-screen, like a native app, and keeps working offline.</p>
        <button class="btn primary" id="install-btn">${ICONS.download} Install app</button>
      ` : ios ? `
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 6px;">On iPhone/iPad: tap the <b>Share</b> button in Safari's toolbar, then <b>Add to Home Screen</b>. It'll then open full-screen from your home screen like any other app.</p>
        <p style="font-size:11.5px;color:var(--ink-faint);margin:0;">This only works in Safari — Chrome/Firefox on iOS can't install home-screen apps due to Apple's restrictions.</p>
      ` : `
        <p style="font-size:13px;color:var(--ink-dim);margin:0 0 6px;">Your browser hasn't offered an install prompt yet. Look for an <b>Install</b> or <b>Add to Home Screen</b> option in your browser's menu (⋮ or share icon) while viewing this page.</p>
        <p style="font-size:11.5px;color:var(--ink-faint);margin:0;">Some browsers only show this after you've visited the page a couple of times.</p>
      `}
    </div>

    <div class="section-label">Appearance</div>
    <div class="card">
      <div class="row">
        <div style="font-size:13.5px;">Theme</div>
        <div class="pill-tabs" style="margin:0;">
          <button data-theme-btn="system" class="${!localStorage.getItem('ipo-theme')?'active':''}">System</button>
          <button data-theme-btn="light" class="${localStorage.getItem('ipo-theme')==='light'?'active':''}">Light</button>
          <button data-theme-btn="dark" class="${localStorage.getItem('ipo-theme')==='dark'?'active':''}">Dark</button>
        </div>
      </div>
    </div>
    <div class="section-label">Manage</div>
    <div class="grid cols-3">
      <button class="btn ghost" data-goto="banks">${ICONS.bank} Banks</button>
      <button class="btn ghost" data-goto="applicants">${ICONS.people} Applicants</button>
      <button class="btn ghost" data-goto="ipos">${ICONS.ipo} IPOs</button>
    </div>
    <div class="section-label">Data</div>
    <div class="card">
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px;">All data is stored locally on this device (IndexedDB) and works offline. Export a backup regularly.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn primary" id="s-export">${ICONS.download} Export backup (JSON)</button>
        <button class="btn ghost" id="s-import">${ICONS.upload} Import backup</button>
        <button class="btn danger" id="s-wipe">${ICONS.trash} Erase all data</button>
      </div>
    </div>
    <div class="section-label">One-time fixes</div>
    <div class="card">
      <p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px;">IPOs added before the SME/Mainboard split have no type set, so they all default to Mainboard. This scans your existing IPOs and tags any with "SME" in the name as SME — it won't touch ones that already have a type set correctly.</p>
      <button class="btn ghost" id="s-fix-sme">${ICONS.ipo} Auto-detect SME IPOs</button>
    </div>
  `;
  const installBtn = document.getElementById('install-btn');
  if(installBtn) installBtn.addEventListener('click', async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const {outcome} = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if(outcome==='accepted') toast('Installing…'); else render();
  });
  main.querySelectorAll('[data-theme-btn]').forEach(b=>b.addEventListener('click',()=>{
    const v = b.dataset.themeBtn;
    if(v==='system') localStorage.removeItem('ipo-theme'); else localStorage.setItem('ipo-theme', v);
    applyTheme(); render();
  }));
  main.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));
  document.getElementById('s-export').addEventListener('click', exportBackup);
  document.getElementById('s-import').addEventListener('click', triggerImport);
  document.getElementById('s-fix-sme').addEventListener('click', autoDetectSmeIpos);
  document.getElementById('s-wipe').addEventListener('click', ()=>{
    openModal(`
      <div class="modal">
        <h3>Erase all data?</h3>
        <p style="font-size:13px;color:var(--ink-dim);">This permanently deletes every bank, applicant, IPO, application, transfer and sale record on this device. Export a backup first if unsure.</p>
        <div class="modal-actions">
          <button class="btn ghost" data-close="1">Cancel</button>
          <button class="btn danger" id="confirm-wipe">Erase everything</button>
        </div>
      </div>
    `);
    document.getElementById('confirm-wipe').addEventListener('click', async ()=>{
      for(const s of ['banks','applicants','ipos','applications','transfers','sales']) await idbClear(s);
      await loadAll();
      closeModal(); toast('All data erased'); go('dashboard');
    });
  });
}

/* ---------- THEME ---------- */
function applyTheme(){
  const t = localStorage.getItem('ipo-theme');
  if(t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ---------- INSTALL (PWA "Add to Home Screen") ---------- */
let deferredInstallPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(State.route==='settings') render(); // refresh so the Install button becomes active
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; toast('App installed'); });

/* ---------- BOOT ---------- */
(async function boot(){
  applyTheme();
  try{
    db = await openDB();
    await loadAll();
  }catch(e){
    console.error('DB init failed', e);
  }
  render();
})();
</script>
</body>
</html>
